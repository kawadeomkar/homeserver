# Both "machines" are this one: the NAS is fake_truenas.py on localhost, and the Proxmox host's
# commands are the scripts in fake_pve_bin/.
[nas]
truenas ansible_connection=local

# Pipelined, as the real Proxmox host is over SSH (ansible.cfg's [ssh_connection]), which also saves each
# module task a file transfer. The NAS's role runs on the controller, unpipelined, here as for real.
[proxmox:vars]
ansible_pipelining=true

[proxmox]
homeserver ansible_connection=local

[kubernetes]
homeserver-k8s ansible_connection=local
