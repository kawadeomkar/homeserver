---
# roles/proxmox_tailscale with this repo's own configuration, run against the fake apt-get, nft, sysctl, systemctl
# and tailscale in fake_tailscale_bin/. Every path the role writes is a scratch path the test passes, and the
# repository is a file:// URL serving a fake signing key, so nothing here reaches the network or the system.
- name: Make the fake Proxmox host the LAN's Tailscale subnet router
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../../group_vars/all/storage.yml
    - ../../group_vars/proxmox/storage.yml
    - ../../group_vars/proxmox/tailscale.yml
  environment:
    PATH: "{{ playbook_dir }}/fake_tailscale_bin:{{ lookup('ansible.builtin.env', 'PATH') }}"
    FAKE_TAILSCALE_STATE: "{{ fake_tailscale_state }}"
    FAKE_TAILSCALE_PYTHON: "{{ ansible_playbook_python }}"
    FAKE_TAILSCALE_SOURCES_DIR: "{{ proxmox_tailscale_sources_dir }}"
    FAKE_TAILSCALE_SYSTEMD_DIR: "{{ proxmox_tailscale_systemd_dir }}"
    FAKE_TAILSCALE_GUARD_FILE: "{{ proxmox_tailscale_guard_file }}"
  roles:
    - role: proxmox_tailscale
