---
# kubernetes.yml's second play, roles/talos with this repo's own configuration, against fake_talos_bin/'s talosctl
# and kubectl and the test's Image Factory. Loads what the kubernetes host's groups would, by name.
- name: Build Talos on the fake nodes
  hosts: kubernetes
  gather_facts: false
  vars_files:
    - ../../group_vars/all/storage.yml
    - ../../group_vars/all/kubernetes.yml
    - ../../group_vars/kubernetes/talos.yml
  environment:
    PATH: "{{ playbook_dir }}/fake_talos_bin:{{ lookup('ansible.builtin.env', 'PATH') }}"
    FAKE_TALOS_STATE: "{{ fake_talos_state }}"
    FAKE_TALOS_PYTHON: "{{ ansible_playbook_python }}"
  roles:
    - role: talos
