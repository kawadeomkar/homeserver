---
# roles/proxmox_apt and roles/proxmox_storage with this repo's own Proxmox configuration, run against the
# fake apt-get, pvesh, pvesm and pvenode in fake_pve_bin/. The repository files go to the scratch directory
# the test passes as proxmox_apt_sources_dir, which the fake apt-get reads too.
- name: Configure the fake Proxmox host
  hosts: proxmox
  gather_facts: false
  vars_files:
    - ../../group_vars/all/storage.yml
    - ../../group_vars/proxmox/storage.yml
    - ../../group_vars/proxmox/apt.yml
  environment:
    PATH: "{{ playbook_dir }}/fake_pve_bin:{{ lookup('ansible.builtin.env', 'PATH') }}"
    FAKE_PVE_STATE: "{{ fake_pve_state }}"
    FAKE_PVE_PYTHON: "{{ ansible_playbook_python }}"
    FAKE_PVE_SOURCES_DIR: "{{ proxmox_apt_sources_dir }}"
  roles:
    - role: proxmox_apt
    - role: proxmox_storage
