title = "homeserver"

[extend]
useDefault = true

# CLAUDE.md: no address, and nothing else that identifies this network, in any tracked file.
# tests/policy/test_gitleaks_rules.py proves every rule on generated fixtures.

[[rules]]
id = "private-ipv4"
description = "Private, CGNAT or link-local IPv4 address"
regex = '''\b((?:10\.(?:25[0-5]|2[0-4]\d|1?\d?\d)|172\.(?:1[6-9]|2\d|3[01])|192\.168|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])|169\.254)\.(?:25[0-5]|2[0-4]\d|1?\d?\d)\.(?:25[0-5]|2[0-4]\d|1?\d?\d))\b'''
secretGroup = 1
keywords = ["10.", "172.", "192.168.", "100.", "169.254."]

[[rules]]
id = "ipv4-literal"
description = "IPv4 literal in code, tests, manifests, scripts or documentation: use a variable, and RFC 5737 in examples"
# molecule/ and .config/molecule/ are where Molecule role tests will go. CI scans a change with its
# target's rules, so they must be covered before the first one is added. Markdown anywhere: a public address
# written in a runbook identifies this network as much as one in a task.
path = '''^(roles/|group_vars/|host_vars/|tests/|molecule/|\.config/molecule/|k8s/|scripts/|\.github/|inventory\.example$|[^/]+\.ya?ml$|ansible\.cfg$|Makefile$)|(^|/)[^/]+\.md$'''
regex = '''\b((?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3})\b'''
secretGroup = 1
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''^(192\.0\.2|198\.51\.100|203\.0\.113)\.''', '''^0\.0\.0\.0$''', '''^127\.''']

[[rules]]
id = "ipv6-private"
description = "IPv6 unique-local (incl. Tailscale) or link-local address"
regex = '''(?i)\b((?:fd[0-9a-f]{2}|fe80):[0-9a-f:]{2,})'''
secretGroup = 1
keywords = ["fd", "fe80"]

[[rules]]
id = "mac-address"
description = "MAC address; a longer colon-hex run (a certificate fingerprint) does not match"
regex = '''(?i)(?:^|[^0-9a-f:])((?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2})(?:[^0-9a-f:]|$)'''
secretGroup = 1

[[rules]]
id = "private-ipv4-partial"
description = "A private network written in part: its first three numbers, then .x, .* or a /prefix"
regex = '''\b((?:10\.(?:25[0-5]|2[0-4]\d|1?\d?\d)|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.(?:25[0-5]|2[0-4]\d|1?\d?\d))(?:\.[xX*]|/\d{1,2}\b)'''
secretGroup = 1
keywords = ["10.", "172.", "192.168."]

[[rules]]
id = "mac-address-dotted"
description = "MAC address in dotted form (aabb.ccdd.eeff)"
regex = '''(?i)(?:^|[^0-9a-f.])([0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4})(?:[^0-9a-f.]|$)'''
secretGroup = 1

[[rules]]
id = "disk-id"
description = "A disk's /dev/disk/by-id name, which carries its model and serial, or a WWN; QEMU's virtual disks excepted"
regex = '''(?i)(/dev/disk/by-id/[a-z0-9]+-[a-z0-9._:-]+|\bwwn-0x[0-9a-f]{16,32}\b|\bnaa\.[0-9a-f]{16,32}\b)'''
secretGroup = 1
keywords = ["/dev/disk/by-id/", "wwn-", "naa."]
  [[rules.allowlists]]
  regexTarget = "match"
  regexes = ['''(?i)QEMU''']

[[rules]]
id = "tailnet-name"
description = "Tailscale MagicDNS name"
regex = '''(?i)\b([a-z0-9-]+\.[a-z0-9-]+\.ts\.net)\b'''
secretGroup = 1
keywords = [".ts.net"]

# gitleaks' own rules do not know Tailscale's keys. The auth key belongs in the vault (vault_tailscale_auth_key).
[[rules]]
id = "tailscale-key"
description = "Tailscale auth key, OAuth client secret, API access token or webhook secret"
regex = '''\b(tskey-(?:auth|client|api|webhook|scim)-[A-Za-z0-9]+-[A-Za-z0-9]+)\b'''
secretGroup = 1
keywords = ["tskey-"]

[[rules]]
id = "k8s-plaintext-secret"
description = "Plaintext Kubernetes Secret manifest"
path = '''(?i)^k8s/.*\.(ya?ml|json)$'''
regex = '''(?m)^[ \t]*(?:-[ \t]+)?kind:[ \t]*["']?Secret["']?[ \t]*(?:#.*)?$|"kind"[ \t]*:[ \t]*"Secret"'''
keywords = ["kind"]
  [[rules.allowlists]]
  paths = ['''\.sops\.ya?ml$''', '''\.(example|template)\.ya?ml$''']

[[rules]]
id = "sensitive-file"
description = "A file that is never committed: the vault and its password, local vars, inventory, machine notes, run logs, the cluster's credentials and Talos's generated files"
path = '''(?i)(^|/)(\.?vault[-_.]?pass[^/]*|(local\.)?vault\.ya?ml(\.init-tmp)?|local\.ya?ml(\.(bak|orig|old|save|swp|tmp|init-tmp))?|MACHINES[^/]*|talosconfig(\.[^/]*)?|kubeconfig(\.[^/]*)?|[^/]*\.kubeconfig|[^/]*\.agekey|secrets\.ya?ml|controlplane\.ya?ml|worker\.ya?ml|logs/[^/]+\.log)$|^inventory(\.(bak|orig|old|ini))?$'''
