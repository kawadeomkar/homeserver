---
# The pull-request gate. The lint, test and kubernetes jobs run the make targets a local `make ci` runs,
# from the hash-locked toolchain, and ci-success is the one check for the "Protect main" ruleset to
# require (its body is .github/rulesets/main.json, applied through the API). No job holds a secret, and
# nothing here can reach the home network: the roles are tested against local fakes.
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Pull-request runs supersede each other; every push to main keeps its own group, so none is cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  # No ANSIBLE_FORCE_COLOR: it overrides the ANSIBLE_NOCOLOR the idempotence tests run ansible-playbook with.
  # Binary tools are pinned by version and checksum. Dependabot cannot see them, so they are bumped by hand
  # with the other pins CLAUDE.md lists; bump each version with its checksum.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUBE_LINTER_VERSION: "0.8.3"
  KUBE_LINTER_SHA256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the hash-locked tooling
        run: make venv PYTHON=python
      # The real vault password never reaches CI: without .vault_pass, make gives ansible-lint a
      # placeholder, and the vault's contents go unlinted (tests/policy checks it stays encrypted).
      # -k: report every failing linter, not only the first. The tests run in the test job.
      - name: yamllint, ansible-lint, ruff, module documentation, GitHub config schemas
        run: make -k linters

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ansible-core 2.21's controller range. The modules run under this Python in the idempotence suite.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the hash-locked tooling
        run: make venv PYTHON=python
      - name: Unit tests
        run: make test
      # Runs both roles against fake_truenas.py and fake_pve_bin; needs openssl, which the image has.
      - name: Idempotence against the TrueNAS and Proxmox fakes
        run: make test-idempotence

  kubernetes:
    name: kubernetes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform and kube-linter (checksums verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          curl -fsSLo kube-linter.tgz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  kube-linter.tgz" | sha256sum -c -
          tar -xzf kube-linter.tgz kube-linter
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # -k: report both tools' findings, not only the first's.
      - name: kubeconform, strict, against Talos's Kubernetes version; kube-linter
        run: make -k lint-k8s

  leaks:
    name: leaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: the range check needs the merge-base with the target and the target's rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the hash-locked tooling
        run: make venv PYTHON=python
      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: The rules and the range check still catch what they must
        run: make test-gitleaks-rules
      # The event's values reach the script only through env:, never inside run:.
      - name: The commits this change adds, with the target's rules
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FIRST_PARENT: ${{ github.event_name == 'push' && '1' || '0' }}
          REQUIRE_COMMITS: ${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}
        run: scripts/ci/check-range.sh

  workflows:
    name: workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A download, not a docker:// step: the repository's actions allow-list rejects container steps.
      # actionlint runs shellcheck, which the runner image has, on every `run:` script.
      - name: Install actionlint (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint (reads .github/actionlint.yaml)
        run: actionlint -color
      - name: shellcheck (scripts/, which the leaks job and the hooks run)
        run: shellcheck scripts/ci/*.sh
      # advanced-security false: findings fail the job instead of only uploading SARIF. The pedantic
      # persona is what flags an image without a digest, or a missing permissions or concurrency block.
      # No version input: the action pulls the zizmor its release pins by digest, so bumping the action
      # bumps zizmor.
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: pedantic

  # Fails a pull request that adds a pip package with a known vulnerability, from the dependency graph of its
  # base and head. It cannot judge the actions: pinned to commit SHAs, they have no version to look up, so
  # zizmor's online known-vulnerable-actions audit (the workflows job) covers them. On a push there is no
  # pull request to compare, so the job is skipped, and ci-success allows that.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci-success:
    name: ci-success
    if: always()
    needs: [lint, test, kubernetes, leaks, workflows, dependency-review]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: dependency-review
