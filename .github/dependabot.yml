---
# Weekly updates for the SHA-pinned actions and every package in the hash-locked Python toolchain.
# Dependabot bumps a pin in requirements.in, or re-resolves a package only the lock names, with
# pip-compile. It cannot see the actionlint, kubeconform and gitleaks versions and checksums in ci.yml, or
# the Makefile's schema pins; CLAUDE.md lists those, which are bumped by hand.
# Every Dependabot PR is read before it is merged, never merged only because CI is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # PR titles follow the repo's "[tag] Statement" form; the trailing space stops Dependabot
      # appending a colon after the bracket. The prefix starts Dependabot's commit subjects too.
      prefix: "[dependencies] "
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # By default only the packages requirements.in names get version updates, and the other packages
    # in the lock would move only for a security advisory.
    allow:
      - dependency-type: all
    groups:
      ansible:
        patterns: ["ansible-core", "ansible-lint"]
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: "[dependencies] "
