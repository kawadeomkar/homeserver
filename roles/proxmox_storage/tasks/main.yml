---
# Uses pvesm over root SSH. community.proxmox's proxmox_storage module only creates storage,
# never corrects it, and has no format option.

# Each problem gets its own sentence, naming the variable to change. Argument validation accepts a string
# for a list (it would split it on commas) but leaves the variable as it was, so the string is refused here
# before anything iterates its characters.
- name: Check the role's inputs
  ansible.builtin.assert:
    that: _errors | length == 0
    fail_msg: "{{ _errors | join(' ') }}"
    quiet: true
  vars:
    _ids: "{{ (proxmox_storage_nfs | map(attribute='id') | list) + ([] if proxmox_storage_local is string else proxmox_storage_local) }}"
    _serverless: "{{ proxmox_storage_nfs | rejectattr('server', 'defined') | map(attribute='id') | list }}"
    _errors: >-
      {%- set out = [] -%}
      {%- if proxmox_storage_local is string -%}
      {%-   set _ = out.append('proxmox_storage_local must be a list of storage ids, such as [local-lvm], not a string.') -%}
      {%- endif -%}
      {%- if _ids | select | unique | list | length != _ids | length -%}
      {%-   set _ = out.append('Storage ids must be unique across proxmox_storage_nfs and proxmox_storage_local, and none may be empty.') -%}
      {%- endif -%}
      {%- if _serverless and proxmox_storage_nfs_server | length == 0 -%}
      {%-   set _ = out.append('No NFS server for ' ~ _serverless | join(', ') ~ ': set proxmox_storage_nfs_server, or a server in the entry.') -%}
      {%- endif -%}
      {{ out }}

- name: Read the storage configuration
  ansible.builtin.command:
    argv: [pvesh, get, /storage, --output-format, json]
  register: proxmox_storage_config
  changed_when: false
  check_mode: false
  when: proxmox_storage_nfs | length > 0 or proxmox_storage_local | length > 0

- name: Work out the wanted settings and what each storage needs
  ansible.builtin.set_fact:
    proxmox_storage_wanted: "{{ _wanted }}"
    proxmox_storage_plan: "{{ _plan }}"
  when: proxmox_storage_nfs | length > 0
  vars:
    _existing: "{{ proxmox_storage_config.stdout | from_json }}"
    # Each entry with the role-wide settings filled in.
    _wanted: >-
      {%- set out = [] -%}
      {%- for s in proxmox_storage_nfs -%}
      {%-   set _ = out.append({
              'id': s.id,
              'server': s.server | default(proxmox_storage_nfs_server),
              'export': s.export,
              'content': s.content | default(proxmox_storage_content) | sort | join(','),
              'format': s.format | default(proxmox_storage_format),
              'options': s.nfs_options | default(proxmox_storage_nfs_options),
              'disable': 0 if s.enabled | default(proxmox_storage_enabled) else 1}) -%}
      {%- endfor -%}
      {{ out }}
    # add, correct, ok, or conflict (same id, different type, server or export).
    _plan: >-
      {%- set have = dict(_existing | map(attribute='storage') | zip(_existing)) -%}
      {%- set plan = {} -%}
      {%- for s in _wanted -%}
      {%-   if s.id not in have -%}
      {%-     set _ = plan.update({s.id: 'add'}) -%}
      {%-   else -%}
      {%-     set h = have[s.id] -%}
      {%-     if h.type != 'nfs' or h.server | default('') != s.server or h.export | default('') != s.export -%}
      {%-       set _ = plan.update({s.id: 'conflict'}) -%}
      {%-     elif (h.content.split(',') | sort | join(',')) != s.content
                or h.format | default('') != s.format
                or h.options | default('') != s.options
                or (h.disable | default(0) | int) != s.disable -%}
      {%-       set _ = plan.update({s.id: 'correct'}) -%}
      {%-     else -%}
      {%-       set _ = plan.update({s.id: 'ok'}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ plan }}

# Storage the node already has, of any type and typically the installer's local-lvm or local-zfs, is
# checked, never created or changed: it must exist, be enabled and hold images.
- name: Work out what the node's own storage lacks
  ansible.builtin.set_fact:
    proxmox_storage_local_problems: "{{ _problems }}"
  when: proxmox_storage_local | length > 0
  vars:
    _existing: "{{ proxmox_storage_config.stdout | from_json }}"
    _problems: >-
      {%- set have = dict(_existing | map(attribute='storage') | zip(_existing)) -%}
      {%- set out = [] -%}
      {%- for id in proxmox_storage_local -%}
      {%-   if id not in have -%}
      {%-     set _ = out.append(id ~ ': does not exist') -%}
      {%-   else -%}
      {%-     if have[id].disable | default(0) | int == 1 -%}
      {%-       set _ = out.append(id ~ ': is disabled') -%}
      {%-     endif -%}
      {%-     if 'images' not in (have[id].content | default('')).split(',') -%}
      {%-       set _ = out.append(id ~ ': has no images in its content') -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

# The message lists the storage Proxmox has, so the id to use instead is in front of whoever reads it.
- name: Refuse a storage that cannot hold VM disks
  ansible.builtin.assert:
    that: proxmox_storage_local_problems | length == 0
    fail_msg: >-
      These storages in proxmox_storage_local cannot hold VM disks: {{ proxmox_storage_local_problems | join('; ') }}.
      Storage configured in Proxmox: {{ _configured | join(', ') }}.{{ ' ' ~ _installer if _missing else '' }}
    quiet: true
  when: proxmox_storage_local | length > 0
  vars:
    _existing: "{{ proxmox_storage_config.stdout | from_json | sort(attribute='storage') }}"
    _missing: "{{ proxmox_storage_local | difference(_existing | map(attribute='storage')) }}"
    _installer: The installer creates local-lvm on an LVM install and local-zfs on a ZFS one; this role does not create storage.
    # Each as "id (type: content)", the content sorted: Proxmox gives it in no fixed order.
    _configured: >-
      {%- set out = [] -%}
      {%- for e in _existing -%}
      {%-   set content = (e.content | default('')).split(',') | select | sort | join(',') -%}
      {%-   set _ = out.append(e.storage ~ ' (' ~ e.type ~ ': ' ~ (content or 'no content')
                               ~ (', disabled' if e.disable | default(0) | int == 1 else '') ~ ')') -%}
      {%- endfor -%}
      {{ out }}

# A storage's type, server and export cannot be changed in place, and replacing a storage that
# holds disks is not something to do implicitly.
- name: Refuse a storage id that already points somewhere else
  ansible.builtin.assert:
    that: proxmox_storage_plan.values() | select('eq', 'conflict') | list | length == 0
    fail_msg: >-
      These storage ids exist with another type, server or export:
      {{ proxmox_storage_plan | dict2items | selectattr('value', 'eq', 'conflict') | map(attribute='key') | join(', ') }}.
      Remove or rename them by hand first.
    quiet: true
  when: proxmox_storage_nfs | length > 0

# Commands do not run in check mode, so this is what a dry run shows: add, correct or ok per NFS
# storage, and present for each of the node's own storages that exists, is enabled and holds images.
# Whether a storage is active on the node is checked only for real, at the end.
- name: Show what will be added or corrected, and what was checked
  ansible.builtin.debug:
    msg: "{{ proxmox_storage_plan | default({}) | combine(dict(proxmox_storage_local | product(['present']))) }}"
  when: proxmox_storage_nfs | length > 0 or proxmox_storage_local | length > 0

- name: Add the NFS storages
  ansible.builtin.command:
    argv: >-
      {{ ['pvesm', 'add', 'nfs', item.id, '--server', item.server, '--export', item.export,
          '--content', item.content, '--format', item.format, '--disable', item.disable | string]
         + (['--options', item.options] if item.options else []) }}
  loop: "{{ proxmox_storage_wanted | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: proxmox_storage_plan[item.id] == 'add'
  changed_when: true

# An empty options setting removes options that were set before.
- name: Correct storage settings that drifted
  ansible.builtin.command:
    argv: >-
      {{ ['pvesm', 'set', item.id, '--content', item.content, '--format', item.format,
          '--disable', item.disable | string]
         + (['--options', item.options] if item.options else ['--delete', 'options']) }}
  loop: "{{ proxmox_storage_wanted | default([]) }}"
  loop_control:
    label: "{{ item.id }}"
  when: proxmox_storage_plan[item.id] == 'correct'
  changed_when: true

# Proxmox names a node after its short hostname. The API's "localhost" alias is not enough: it
# works for storage status, but /nodes/localhost/config answers {} even when settings exist. The name is
# read only when something uses it: the node configuration, or the status checks, which run only for real.
- name: Find the node's name
  ansible.builtin.command:
    argv: [hostname, -s]
  register: proxmox_storage_hostname
  changed_when: false
  check_mode: false
  when:
    - proxmox_storage_node | length == 0
    - not ansible_check_mode or proxmox_storage_startall_delay is not none

- name: Use the node's name
  ansible.builtin.set_fact:
    proxmox_storage_node_name: "{{ proxmox_storage_node if proxmox_storage_node | length > 0 else proxmox_storage_hostname.stdout | trim }}"
  when: not ansible_check_mode or proxmox_storage_startall_delay is not none

- name: Read the node configuration
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ proxmox_storage_node_name }}/config", --output-format, json]
  register: proxmox_storage_node_config
  changed_when: false
  check_mode: false
  when: proxmox_storage_startall_delay is not none

- name: Show the start-on-boot delay, current and wanted
  ansible.builtin.debug:
    msg: >-
      startall-onboot-delay on {{ proxmox_storage_node_name }}:
      {{ _current }} -> {{ proxmox_storage_startall_delay }}{{ '' if _current | int != proxmox_storage_startall_delay | int else ' (no change)' }}
  when: proxmox_storage_startall_delay is not none
  vars:
    _current: "{{ (proxmox_storage_node_config.stdout | from_json).get('startall-onboot-delay', 0) }}"

- name: Set the node's start-on-boot delay
  ansible.builtin.command:
    argv: [pvenode, config, set, --startall-onboot-delay, "{{ proxmox_storage_startall_delay }}"]
  when:
    - proxmox_storage_startall_delay is not none
    - >-
      (proxmox_storage_node_config.stdout | from_json).get('startall-onboot-delay', 0) | int
      != proxmox_storage_startall_delay | int
  changed_when: true

# The NFS storages, and the node's own storages the role was asked to check. Only for real: in check
# mode a storage the role would add does not exist yet.
- name: Read each enabled storage's status on the node
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ proxmox_storage_node_name }}/storage/{{ item.id }}/status", --output-format, json]
  register: proxmox_storage_status
  changed_when: false
  loop: "{{ _to_check }}"
  loop_control:
    label: "{{ item.id }}"
  when:
    - not ansible_check_mode
    - item.disable == 0
  vars:
    _to_check: >-
      {%- set out = [] -%}
      {%- for id in proxmox_storage_local -%}
      {%-   set _ = out.append({'id': id, 'disable': 0}) -%}
      {%- endfor -%}
      {{ (proxmox_storage_wanted | default([])) + out }}

# Proxmox answers for a storage it cannot use rather than failing: enabled 0 when the storage is
# restricted to other nodes, active 0 when it could not be activated (an NFS server out of reach, a ZFS
# pool that was not imported, a missing thin pool).
- name: Check each enabled storage is mounted and active
  ansible.builtin.assert:
    that: _unusable | length == 0
    fail_msg: >-
      These storages cannot hold VM disks on {{ proxmox_storage_node_name }} now:
      {{ _unusable | join('; ') }}. `pvesm status` on the node shows the same.
    quiet: true
  when: not ansible_check_mode
  vars:
    _unusable: >-
      {%- set out = [] -%}
      {%- for r in proxmox_storage_status.results | default([]) if r is not skipped -%}
      {%-   set s = r.stdout | from_json -%}
      {%-   if s.enabled | default(1) | int != 1 -%}
      {%-     set _ = out.append(r.item.id ~ ': not enabled on this node, so probably restricted to other nodes') -%}
      {%-   elif s.active | default(0) | int != 1 -%}
      {%-     set _ = out.append(r.item.id ~ ': enabled but not active (an NFS server out of reach, a pool not imported?)') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
