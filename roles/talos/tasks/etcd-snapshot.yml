---
# tasks_from: etcd-snapshot. An etcd snapshot alone (make etcd-snapshot).
- name: etcd-snapshot | Check the role's inputs
  ansible.builtin.import_tasks: validate.yml

- name: etcd-snapshot | Take a snapshot
  when: talos_nodes | length > 0
  block:
    # Only what a snapshot needs: no Image Factory and no probe of the other nodes, so it works on a degraded
    # cluster, when a snapshot matters most.
    - name: etcd-snapshot | Prepare
      ansible.builtin.import_tasks: prepare.yml
      vars:
        talos_prepare_minimal: true

    - name: etcd-snapshot | Snapshot
      ansible.builtin.import_tasks: snapshot.yml
  always:
    - name: etcd-snapshot | Remove the scratch directory
      ansible.builtin.file:
        path: "{{ talos_workspace }}"
        state: absent
      changed_when: false
      check_mode: false
      when: talos_workspace is defined
