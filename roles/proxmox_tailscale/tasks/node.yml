---
# The node itself: tailscaled enabled and running, the node logged in once with the auth key, brought back up if
# someone ran `tailscale down`, then its routes and preferences kept with `tailscale set`, compared key by key with
# `tailscale get --json`, which uses the same flag names. `tailscale status --json` lists every device in the tailnet
# and the tailnet's name, so it is read without being printed, and only the fields used here are kept.

# `tailscale up` takes most preferences, but not these, which only `tailscale set` does. Logging in with the
# preferences it takes means the node never runs, even for a moment, with Tailscale's defaults, such as accept-dns.
- name: node | Work out the flags for tailscale up and tailscale set
  ansible.builtin.set_fact:
    proxmox_tailscale_set_flags: "{{ _flags }}"
    proxmox_tailscale_up_flags: >-
      {{ ['--advertise-tags=' ~ proxmox_tailscale_tags | join(',')]
         + (_flags | reject('match', '^--(' ~ _set_only | join('|') ~ ')=') | list) }}
  vars:
    _set_only: [auto-update, nickname, relay-server-port, relay-server-static-endpoints, update-check, webclient]
    _flags: >-
      {%- set out = ['--advertise-routes=' ~ proxmox_tailscale_advertise_routes | join(',')] -%}
      {%- for key, value in proxmox_tailscale_settings.items() -%}
      {%-   set _ = out.append('--' ~ key ~ '=' ~ ((value | string | lower) if value is boolean else value)) -%}
      {%- endfor -%}
      {{ out }}

# tailscaled's package enables and starts it. Stopped by hand, or never started at boot because the guard it requires
# failed to load, it stays down once the guard is back, so it is started here, after the guard. A unit systemd does
# not know yet (is-enabled prints nothing) is one a dry run on a fresh node has still to install.
- name: node | Read whether tailscaled is enabled and running
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [systemctl, is-enabled, tailscaled.service]
    - [systemctl, is-active, tailscaled.service]
  loop_control:
    label: "{{ item | join(' ') }}"
  register: proxmox_tailscale_daemon_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: node | Work out what tailscaled needs
  ansible.builtin.set_fact:
    proxmox_tailscale_daemon_enable: "{{ _enabled not in ['', 'enabled'] }}"
    proxmox_tailscale_daemon_start: "{{ _enabled != '' and _active != 'active' }}"
  vars:
    _enabled: "{{ proxmox_tailscale_daemon_state.results[0].stdout | trim }}"
    _active: "{{ proxmox_tailscale_daemon_state.results[1].stdout | trim }}"

- name: node | Enable tailscaled at boot
  ansible.builtin.command:
    argv: [systemctl, enable, tailscaled.service]
  changed_when: true
  when: proxmox_tailscale_daemon_enable

# Through its Requires=, starting tailscaled also starts the guard, which the guard tasks have already loaded.
- name: node | Start tailscaled
  ansible.builtin.command:
    argv: [systemctl, start, tailscaled.service]
  changed_when: true
  when: proxmox_tailscale_daemon_start

- name: node | Say what tailscaled needs
  ansible.builtin.debug:
    msg: "Would {{ _actions | join(' and ') }}."
  vars:
    _actions: >-
      {{ (['enable tailscaled at boot'] if proxmox_tailscale_daemon_enable else [])
         + (['start tailscaled, which is not running; its login is read once it runs'] if proxmox_tailscale_daemon_start
            else []) }}
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_tailscale_daemon_enable or proxmox_tailscale_daemon_start

# tailscaled restarts when its package is upgraded, so it may still be starting. In check mode the command fails on a
# fresh node, where Tailscale is not installed yet, and on one whose tailscaled a real run would start.
- name: node | Read the node's state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: proxmox_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  retries: 10
  delay: 3
  until: >-
    (ansible_check_mode and proxmox_tailscale_status.rc != 0)
    or (proxmox_tailscale_status.rc == 0
        and (proxmox_tailscale_status.stdout | from_json).BackendState not in ['NoState', 'Starting'])

# NotStarted: a dry run on a node whose tailscaled the real run starts, whose login is not known until it runs.
- name: node | Keep the node's backend state
  ansible.builtin.set_fact:
    proxmox_tailscale_backend: >-
      {{ (proxmox_tailscale_status.stdout | from_json).BackendState if proxmox_tailscale_status.rc == 0
         else 'NotRunning' if not ansible_check_mode
         else 'NotStarted' if proxmox_tailscale_daemon_start
         else 'NeedsLogin' }}

- name: node | Refuse a node Tailscale cannot log in or bring up
  ansible.builtin.assert:
    that: >-
      proxmox_tailscale_backend in ['Running', 'Stopped', 'NeedsLogin']
      or (ansible_check_mode and proxmox_tailscale_backend == 'NotStarted')
    fail_msg: "{{ _approval if proxmox_tailscale_backend == 'NeedsMachineAuth' else _silent }}"
    quiet: true
  vars:
    _approval: >-
      Tailscale is waiting for the device to be approved in the admin console (Machines): device approval is on, and
      the auth key was not pre-approved.
    _silent: >-
      tailscaled does not answer on the node (tailscale status: {{ proxmox_tailscale_backend }}); see journalctl -u
      tailscaled.

# The guard filters by interface name, and tailscale0 is the one tailscaled makes by default, before its backend
# answers. Started with --tun naming another interface, tailscaled would forward past the guard; with
# userspace-networking it makes none, and its connections come from the node itself, which the guard cannot see.
# Checked before any login, so a node that would bypass the guard never advertises a route.
- name: node | Read whether tailscaled has the interface the guard filters
  ansible.builtin.command:
    argv: [ip, -o, link, show, dev, tailscale0]
  register: proxmox_tailscale_interface
  changed_when: false
  failed_when: false
  check_mode: false
  when: proxmox_tailscale_status.rc == 0

- name: node | Refuse a tailscaled the guard cannot see
  ansible.builtin.assert:
    that: proxmox_tailscale_interface.rc == 0
    fail_msg: >-
      tailscaled is running without the interface tailscale0, which the tailnet guard filters by name: it was started
      with --tun naming another interface, or with --tun=userspace-networking, whose connections come from the node
      itself. Remove --tun from FLAGS in /etc/default/tailscaled, and from any drop-in that changes tailscaled's
      command line, then restart tailscaled at the console and run again.
    quiet: true
  when: proxmox_tailscale_interface is not skipped

- name: node | Refuse to log in without an auth key
  ansible.builtin.assert:
    that: proxmox_tailscale_backend != 'NeedsLogin' or proxmox_tailscale_auth_key | length > 0
    fail_msg: >-
      The node is not logged in to a tailnet, and proxmox_tailscale_auth_key is empty. Make a one-off, pre-approved
      auth key tagged {{ proxmox_tailscale_tags | join(', ') }} in Tailscale's admin console, set it (in this repo:
      vault_tailscale_auth_key in the vault, with just vault; scripts/runbooks/tailscale.md), and run again.
    quiet: true

# The key goes to the node in a file only root can read, and to tailscale as --auth-key=file:<path>, so it never
# appears in an argument list, a log or Ansible's output.
- name: node | Log in, or bring the node back up
  when:
    - proxmox_tailscale_backend in ['NeedsLogin', 'Stopped']
    - not ansible_check_mode
  block:
    - name: node | Make a private file for the auth key
      ansible.builtin.tempfile:
        state: file
        suffix: .tailscale
      register: proxmox_tailscale_key_file
      when: proxmox_tailscale_backend == 'NeedsLogin'

    - name: node | Write the auth key into it
      ansible.builtin.copy:
        content: "{{ proxmox_tailscale_auth_key }}"
        dest: "{{ proxmox_tailscale_key_file.path }}"
        mode: "0600"
      no_log: true
      when: proxmox_tailscale_backend == 'NeedsLogin'

    # Every managed flag is named, so tailscale up never refuses as changing settings it was not told about.
    - name: node | Run tailscale up
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--timeout=120s'] + _key + proxmox_tailscale_up_flags }}"
      changed_when: true
      vars:
        _key: "{{ ['--auth-key=file:' ~ proxmox_tailscale_key_file.path] if proxmox_tailscale_backend == 'NeedsLogin' else [] }}"
  always:
    - name: node | Remove the auth key's file
      ansible.builtin.file:
        path: "{{ proxmox_tailscale_key_file.path }}"
        state: absent
      when: proxmox_tailscale_key_file.path is defined

- name: node | Say what logging in would do
  ansible.builtin.debug:
    msg: >-
      Would {{ 'log the node in with the auth key' if proxmox_tailscale_backend == 'NeedsLogin' else 'bring the node back
      up' }}: tailscale up {{ proxmox_tailscale_up_flags | join(' ') }}, then tailscale set for the rest.
  changed_when: true
  when:
    - ansible_check_mode
    - proxmox_tailscale_backend in ['NeedsLogin', 'Stopped']

# A dry run on a node that is not running yet has nothing to compare: the line above says what it would do.
- name: node | Read the node's preferences
  ansible.builtin.command:
    argv: [tailscale, get, --json]
  register: proxmox_tailscale_prefs
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or proxmox_tailscale_backend == 'Running'

# advertise-routes as a set, whether tailscale writes it as a list or a comma-separated string; every setting by its
# flag name, as tailscale get --json keys it (filter_plugins/proxmox_tailscale.py, which just status shares).
- name: node | Work out which preferences differ
  ansible.builtin.set_fact:
    proxmox_tailscale_differ: >-
      {{ proxmox_tailscale_prefs.stdout
         | proxmox_tailscale_differ(proxmox_tailscale_advertise_routes, proxmox_tailscale_settings) }}
  when: proxmox_tailscale_prefs is not skipped

- name: node | Set the node's routes and preferences
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'set'] + proxmox_tailscale_set_flags }}"
  changed_when: true
  when: proxmox_tailscale_differ | default([]) | length > 0

- name: node | Say which preferences differ
  ansible.builtin.debug:
    msg: "{{ 'Would set' if ansible_check_mode else 'Set' }} {{ proxmox_tailscale_differ | join(', ') }} with tailscale set."
  changed_when: ansible_check_mode
  when: proxmox_tailscale_differ | default([]) | length > 0

- name: node | Read the node's state after the changes
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: proxmox_tailscale_status_after
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: proxmox_tailscale_status.rc == 0

# Serve proxies connections from the node itself, with the address the guarded hosts trust, which the guard cannot
# see. Its configuration can name the tailnet, so it is read without being printed.
- name: node | Read Tailscale Serve's configuration
  ansible.builtin.command:
    argv: [tailscale, serve, status, --json]
  register: proxmox_tailscale_serve
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: proxmox_tailscale_status.rc == 0

# What only the admin console, or the owner on the node, can fix. Reported on every run, never a failure; just status
# lists the same, through the same filter (filter_plugins/proxmox_tailscale.py), and so do the records left to do
# (NEXT STEPS): each but Tailscale's health warnings, which are shown only, as just status shows them.
- name: node | Say what the admin console must fix, and record it
  when: proxmox_tailscale_status_after is not skipped
  vars:
    _items: >-
      {{ (proxmox_tailscale_status_after.stdout if proxmox_tailscale_status_after.rc == 0 else '')
         | proxmox_tailscale_console(proxmox_tailscale_serve.stdout if proxmox_tailscale_serve.rc == 0 else '',
                                     proxmox_tailscale_advertise_routes, proxmox_tailscale_tags,
                                     proxmox_tailscale_guard_hosts) }}
  block:
    - name: node | Report what the admin console must fix
      ansible.builtin.debug:
        msg: "{{ _items | map(attribute='text') | list if _items else 'Nothing for the admin console to fix.' }}"

    - name: node | Record what the admin console must fix
      ansible.builtin.set_stats:
        data:
          homeserver_next:
            tailscale: >-
              {%- set out = {} -%}
              {%- for item in _items if item.kind != 'health' -%}
              {%-   set _ = out.update({item.kind: {'text': item.text}}) -%}
              {%- endfor -%}
              {{ out }}
