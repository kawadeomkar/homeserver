---
# Read-only, for just status (status.yml, roles/status): the node's Tailscale, its guard and its forwarding, and what
# only the admin console can fix, in proxmox_tailscale_status_state, and never an error. Whether tailscaled runs is
# whether tailscale status answers, and whether the guard is loaded whether nft lists its table; a node that does not
# answer is recorded as such. The module tailscale_read runs the five reads at once, one round trip rather than five.
# tailscale status --json lists every device and login on the tailnet, and Serve's configuration can name the
# tailnet: the reads are under no_log, and the filter keeps only the node's own entry.

- name: status | Read the node's state, preferences, Serve, guard and forwarding, at once
  tailscale_read: {}
  register: proxmox_tailscale_status_reads
  ignore_unreachable: true
  no_log: true

- name: status | Work out what the node says
  ansible.builtin.set_fact:
    proxmox_tailscale_status_state: >-
      {{ _reads.status | default(proxmox_tailscale_status_reads)
         | proxmox_tailscale_status(_reads.prefs | default(none), _reads.serve | default(none),
                                    _reads.table | default(none), _reads.forwarding | default(none),
                                    proxmox_tailscale_advertise_routes, proxmox_tailscale_tags,
                                    proxmox_tailscale_settings, proxmox_tailscale_guard_hosts,
                                    proxmox_tailscale_guard_allow) }}
  vars:
    # A host that did not answer has no results: its registered result says why.
    _reads: "{{ proxmox_tailscale_status_reads.results | default({}) }}"
