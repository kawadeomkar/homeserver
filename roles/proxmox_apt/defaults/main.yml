---
# Neutral defaults: with nothing else set, the role changes nothing. The repositories to write or
# disable, and whether to upgrade, are configuration, set in inventory group_vars; see README.md.

# Where apt keeps its deb822 repository files. The idempotence tests point it at a scratch directory.
proxmox_apt_sources_dir: /etc/apt/sources.list.d
# The Debian release the repositories are for (trixie for Proxmox VE 9). Empty reads VERSION_CODENAME
# from the node's /etc/os-release, so a reinstall on a newer release gets that release's repositories.
proxmox_apt_suite: ""
# The key every Proxmox repository is signed with, for entries that do not name their own.
proxmox_apt_signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg

# Repository files to write, each as <name>.sources in proxmox_apt_sources_dir: name, uris and
# components; optional suites (default: the release above) and signed_by.
proxmox_apt_sources: []
# Names of repository files that must not be used, such as the enterprise ones on a host with no
# subscription: each <name>.sources that exists gets `Enabled: false`, and keeps its other lines.
# One that does not exist is left alone.
proxmox_apt_disabled: []

# Refresh the package lists and upgrade every package (apt-get dist-upgrade, which Proxmox requires in
# place of a plain upgrade). A dry run only simulates the upgrade, with the lists as last refreshed.
proxmox_apt_upgrade: false
# Packages besides the kernel whose upgrade takes effect only at boot, such as CPU microcode, which the kernel
# loads only at boot, or dbus, whose system bus cannot be restarted. An upgrade of one, or of a kernel, is recorded
# in proxmox_apt_reboot_required_file, and every run says a reboot is needed until the node boots. The role never
# reboots the node itself.
proxmox_apt_reboot_packages: []
# Debian's flag for a pending reboot. It is in /run, which every boot empties, so it lasts until the node boots.
# The idempotence tests point it at a scratch file.
proxmox_apt_reboot_required_file: /run/reboot-required
