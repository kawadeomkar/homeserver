---
# tasks_from: report. Puts together what each host of status_hosts found (status_found, from the main entry point,
# which also asked the apps' addresses), ranks what needs attention, writes the report to status_report_file and shows
# it as text. just status runs as a dry run and takes its exit code from that file, so the file is written in a dry
# run too; it holds addresses, so only its owner may read it. Beside it, status_upgrades_kept_file keeps the Proxmox
# host's upgrade simulation's fresh answer for the next run.

- name: report | Put the findings together
  ansible.builtin.set_fact:
    status_findings: >-
      {{ status_hosts | map('extract', hostvars) | map(attribute='status_found', default={}) | list | status_merge }}

# When it was read: status_read_at and status_now, as just status's callback has them to show each section as soon as
# it is read, else now.
- name: report | Rank what needs attention
  ansible.builtin.set_fact:
    status_report: >-
      {{ status_findings
         | status_report(status_setup, status_types,
                         status_read_at or now().strftime('%Y-%m-%d %H:%M %Z') | trim,
                         admin=status_admin, commands=status_commands,
                         now=status_now or now().timestamp() | int) }}

# In the controller's own process (action_plugins/status_write_json.py): copy took 0.4 s of every run, two modules.
- name: report | Write the report as JSON
  status_write_json:
    path: "{{ status_report_file }}"
    content: "{{ status_report }}"
  check_mode: false
  when: status_report_file | length > 0

# With status_mask, every address in the text reads <addr>; the file above keeps them.
- name: report | Show the report
  ansible.builtin.debug:
    msg: "{{ status_report | status_text(status_color, status_mask) }}"
  when: not status_quiet

# The Proxmox host's upgrade simulation, answered afresh, with its key: the next run answers it from here while the key
# is the same. Only this machine keeps it: just status changes nothing on a host. After the report is shown, and never
# a failure: the report is whole without it, and a file that cannot be written only means the next run simulates.
- name: report | Keep the upgrade simulation's answer
  status_write_json:
    path: "{{ status_upgrades_kept_file }}"
    content: "{{ _kept }}"
  check_mode: false
  failed_when: false
  when: status_upgrades_kept_file | length > 0 and _kept | length > 0
  vars:
    _kept: >-
      {{ status_hosts | map('extract', hostvars) | map(attribute='status_upgrades_fresh', default={})
         | select | first | default({}) }}
