---
# tasks_from: report. Puts together what each host of status_hosts found (status_found, from the main entry point,
# which also asked the apps' addresses), ranks what needs attention, writes the report to status_report_file and shows
# it as text. just status runs as a dry run and takes its exit code from that file, so the file is written in a dry
# run too; it holds addresses, so only its owner may read it.

- name: report | Put the findings together
  ansible.builtin.set_fact:
    status_findings: >-
      {{ status_hosts | map('extract', hostvars) | map(attribute='status_found', default={}) | list | status_merge }}

# When it was read: status_read_at and status_now, as just status's callback has them to show each section as soon as
# it is read, else now.
- name: report | Rank what needs attention
  ansible.builtin.set_fact:
    status_report: >-
      {{ status_findings
         | status_report(status_setup, status_types,
                         status_read_at or now().strftime('%Y-%m-%d %H:%M %Z') | trim,
                         admin=status_admin, commands=status_commands,
                         now=status_now or now().timestamp() | int) }}

- name: report | Write the report
  when: status_report_file | length > 0
  block:
    # Only the first time: a task less to wait for on every run after.
    - name: report | Make the report's directory
      ansible.builtin.file:
        path: "{{ status_report_file | dirname }}"
        state: directory
        mode: "0700"
      check_mode: false
      when: status_report_file | dirname is not directory

    - name: report | Write the report as JSON
      ansible.builtin.copy:
        content: "{{ status_report | to_nice_json }}\n"
        dest: "{{ status_report_file }}"
        mode: "0600"
      check_mode: false

- name: report | Show the report
  ansible.builtin.debug:
    msg: "{{ status_report | status_text(status_color) }}"
  when: not status_quiet
