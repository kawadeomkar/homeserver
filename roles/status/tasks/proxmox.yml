---
# The Proxmox host, in two reads: the node's name, which the API's paths need, and when the VMs are shown which VMs
# run, from the pid files qemu-server keeps (status_proxmox_run_dir), which says whose day's history to read, both at
# once; then everything else at once. Proxmox's own reads go through its API on the host's loopback with the token
# (status_proxmox_token_id, status_proxmox_token_secret), each a few milliseconds: pvesh started Proxmox's Perl API
# afresh for each, 0.65 s of CPU on the home host and 1.4 s on a four-core one, 6 to 11 s for them all. Without
# status_proxmox_run_dir the first read is /cluster/resources. A host that does not answer is recorded, not a failure:
# the report says so, and so does a token missing or refused.
# status_reads (main.yml) says what the sections shown need: the host itself (proxmox), its Tailscale (tailscale,
# which status.yml read before), or both.

# Its Tailscale, before the host's own reads, in status_early, for just status's callback to show the sections that
# need nothing else (the admin pages) as soon as it is read. This machine's view of the tailnet's DNS is the cluster's
# to read (cluster.yml), so it is never said here: the findings' merge lets the last host to say a source win.
- name: proxmox | Say what its Tailscale says
  ansible.builtin.set_fact:
    status_early:
      tailscale: "{{ status_tailscale_state }}"
  when: "'tailscale' in status_reads"

- name: proxmox | Read the node's name and which VMs run
  status_read:
    commands: "{{ _commands }}"
    api: "{{ _api }}"
    api_url: "{{ status_proxmox_api_url }}"
    api_token_id: "{{ status_proxmox_token_id }}"
    api_token_secret: "{{ status_proxmox_token_secret }}"
    api_cert_files: "{{ status_proxmox_api_cert_files }}"
    parallel: "{{ status_parallel }}"
    timeout: "{{ status_timeout }}"
  register: status_proxmox_first
  ignore_unreachable: true
  when: "'proxmox' in status_reads and (_commands | length + _api | length) > 0"
  vars:
    _vms: "{{ 'vms' in status_types | status_types_shown }}"
    _api: "{{ {'resources': ['/cluster/resources']} if _vms and status_proxmox_run_dir | length == 0 else {} }}"
    _commands: >-
      {%- set c = {} -%}
      {%- if _vms and status_proxmox_run_dir | length > 0 -%}
      {%-   set _ = c.update({'running': ['ls', status_proxmox_run_dir]}) -%}
      {%- endif -%}
      {%- if status_proxmox_node | length == 0 -%}
      {%-   set _ = c.update({'hostname': ['hostname', '-s']}) -%}
      {%- endif -%}
      {{ c }}

- name: proxmox | Use the node's name
  ansible.builtin.set_fact:
    status_proxmox_node_name: >-
      {{ status_proxmox_node if status_proxmox_node | length > 0
         else status_proxmox_first.results.hostname.stdout | default('') | trim }}
  when: "'proxmox' in status_reads"

# The day's history of every VM running on the node, this setup's and any other, and of each of this setup's VMs; the
# pending changes of each of this setup's; the guest agent's filesystems and OS of those whose agent reports them
# (Home Assistant's; Talos's lists no filesystem), and the address of one that serves an app without a URL of its own;
# the upgrades apt would make, from the lists as last refreshed (a simulation, which is quick, where the API's own
# list takes four seconds), answered from the last answer while dpkg's status and journal, the lists and apt's
# configuration are as they were (status_upgrades_state_paths), a key of their files' metadata; whether an upgrade
# asked for a reboot; and the backups: the host's jobs (each with its next run), the latest backup runs, running ones
# among them, and when each job's schedule fires next, twice, which gives its period without reading the calendar
# format here. With them, the token's own privileges, which say whether it may read all of that: a token that may not
# is reported, never taken for an empty host. All of them through Proxmox's API with the token (status_read's api),
# each a few milliseconds where pvesh starts Proxmox's Perl API afresh, but two: a storage's disks (each budgeted
# storage's) and its backups (each of this setup's jobs' storages), which Proxmox lists only to a token that may
# change them (VM.Config.Disk, VM.Backup), so they stay pvesh's, as root, in the same pass.
- name: proxmox | Read the host, its storages and its VMs, at once
  status_read:
    commands: "{{ _commands }}"
    api: "{{ _api }}"
    api_url: "{{ status_proxmox_api_url }}"
    api_token_id: "{{ status_proxmox_token_id }}"
    api_token_secret: "{{ status_proxmox_token_secret }}"
    api_cert_files: "{{ status_proxmox_api_cert_files }}"
    upgrades_state_paths: "{{ status_upgrades_state_paths if status_upgrades_kept_file | length > 0 else [] }}"
    upgrades_kept: >-
      {{ lookup('ansible.builtin.file', status_upgrades_kept_file, errors='ignore') | default('', true)
         | status_upgrades_kept if status_upgrades_kept_file | length > 0 else {} }}
    upgrades_host: "{{ status_proxmox_node_name }}"
    parallel: "{{ status_parallel }}"
    timeout: "{{ status_timeout }}"
  register: status_proxmox_reads
  ignore_unreachable: true
  when:
    - "'proxmox' in status_reads and not (status_proxmox_first.unreachable | default(false))"
    - (_commands | length + _api | length) > 0
  vars:
    _node: "/nodes/{{ status_proxmox_node_name }}"
    _json: [--output-format, json]
    _day: [timeframe=day, cf=AVERAGE]
    _types: "{{ status_types | status_types_shown }}"
    _running: "{{ status_proxmox_first.results | default({}) | status_running_vms(status_proxmox_node_name) }}"
    _api: >-
      {%- set c = {'permissions': ['/access/permissions']} -%}
      {%- if 'resources' not in status_proxmox_first.results | default({}) -%}
      {%-   set _ = c.update({'resources': ['/cluster/resources']}) -%}
      {%- endif -%}
      {%- if 'vms' in _types -%}
      {%-   set _ = c.update({'node': [_node ~ '/status'], 'rrd-node': [_node ~ '/rrddata'] + _day}) -%}
      {%-   for vmid in (status_vms | map(attribute='vmid') | map('int') | list + _running) | unique -%}
      {%-     set _ = c.update({'rrd-' ~ vmid: [_node ~ '/qemu/' ~ vmid ~ '/rrddata'] + _day}) -%}
      {%-   endfor -%}
      {%-   for vm in status_vms -%}
      {%-     set _ = c.update({'pending-' ~ vm.vmid: [_node ~ '/qemu/' ~ vm.vmid ~ '/pending']}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- for vm in status_vms if vm.guest_agent | default(false) and ('vms' in _types or 'apps' in _types) -%}
      {%-   set agent = _node ~ '/qemu/' ~ vm.vmid ~ '/agent/' -%}
      {%-   set _ = c.update({'fsinfo-' ~ vm.vmid: [agent ~ 'get-fsinfo'], 'osinfo-' ~ vm.vmid: [agent ~ 'get-osinfo']}) -%}
      {%-   if vm.app | default(none) and not vm.app.url | default('') -%}
      {%-     set _ = c.update({'network-' ~ vm.vmid: [agent ~ 'network-get-interfaces']}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- if 'backups' in _types -%}
      {%-   set _ = c.update({'backup-jobs': ['/cluster/backup'],
                            'backup-tasks': [_node ~ '/tasks', 'typefilter=vzdump', 'source=all', 'limit=20']}) -%}
      {%-   for job in status_backup_jobs -%}
      {%-     set _ = c.update({'schedule-' ~ job.id: ['/cluster/jobs/schedule-analyze', 'schedule=' ~ job.schedule,
                                                     'iterations=2']}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ c }}
    _commands: >-
      {%- set c = {} -%}
      {%- if 'vms' in _types -%}
      {%-   set _ = c.update({'updates': ['apt-get', '-q', '-s', 'dist-upgrade']}) -%}
      {%-   if status_reboot_required_file | length > 0 -%}
      {%-     set _ = c.update({'reboot': ['test', '-e', status_reboot_required_file]}) -%}
      {%-   endif -%}
      {%- endif -%}
      {%- if 'storage' in _types -%}
      {%-   for storage in status_budget_storages -%}
      {%-     set _ = c.update({'content-' ~ storage: ['pvesh', 'get', _node ~ '/storage/' ~ storage ~ '/content'] + _json}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- if 'backups' in _types -%}
      {%-   for job in status_backup_jobs -%}
      {%-     set _ = c.update({'backups-' ~ job.storage: ['pvesh', 'get', _node ~ '/storage/' ~ job.storage ~ '/content',
                                                         '--content', 'backup'] + _json}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ c }}

# The simulation's answer and its key, for the report play to keep: only a fresh one, since a kept one is kept already.
- name: proxmox | Say what the upgrade simulation answered
  ansible.builtin.set_fact:
    status_upgrades_fresh: "{{ status_proxmox_reads.results.updates | default(none) | status_upgrades_to_keep }}"
  when: status_upgrades_kept_file | length > 0

# Which VMs a failed backup run failed, and why, is only in its log: read those of the newest few that failed.
- name: proxmox | Read the logs of the backup runs that failed
  status_read:
    commands: {}
    api: >-
      {%- set c = {} -%}
      {%- for upid in _runs -%}
      {%-   set _ = c.update({'log-' ~ upid: ['/nodes/' ~ status_proxmox_node_name ~ '/tasks/' ~ upid ~ '/log',
                                             'limit=5000']}) -%}
      {%- endfor -%}
      {{ c }}
    api_url: "{{ status_proxmox_api_url }}"
    api_token_id: "{{ status_proxmox_token_id }}"
    api_token_secret: "{{ status_proxmox_token_secret }}"
    api_cert_files: "{{ status_proxmox_api_cert_files }}"
    parallel: "{{ status_parallel }}"
    timeout: "{{ status_timeout }}"
  register: status_proxmox_logs
  ignore_unreachable: true
  when: _runs | length > 0
  vars:
    _runs: "{{ status_proxmox_reads.results | default({}) | status_backup_failed_runs }}"

- name: proxmox | Work out what the host says
  ansible.builtin.set_fact:
    status_proxmox_found: >-
      {{ {'unread': _unread, 'node': status_proxmox_node_name,
          'results': status_proxmox_first.results | default({}) | combine(status_proxmox_reads.results | default({}),
                                                                         status_proxmox_logs.results | default({}))}
         | status_proxmox(status_vms, status_budget_storages, status_storage_headroom_gib,
                          status_reboot_required_file, status_backup_jobs)
         if 'proxmox' in status_reads else none }}
  vars:
    _missed: >-
      {{ [status_proxmox_first, status_proxmox_reads, status_proxmox_logs] | selectattr('unreachable', 'defined')
         | selectattr('unreachable') | list }}
    _unread: >-
      {{ (_missed | first).msg | default('it did not answer') if _missed
         else ('' if status_proxmox_node_name | length > 0 else 'hostname -s named no node') }}

# The address of an app on a VM of its own (Home Assistant's), asked from this machine as the cluster's apps are.
- name: proxmox | Ask Home Assistant's address
  status_probe:
    targets: "{{ _targets }}"
    timeout: "{{ status_probe_timeout }}"
  delegate_to: localhost
  register: status_proxmox_probes
  when: status_probe_apps and _targets | length > 0
  vars:
    _targets: "{{ {'proxmox': status_proxmox_found} | status_probe_targets(status_types) }}"

- name: proxmox | Say what the host says
  ansible.builtin.set_fact:
    status_found:
      proxmox: "{{ status_proxmox_found }}"
      # What roles/proxmox_tailscale's status entry point read, before this role ran: {} when Tailscale is off.
      tailscale: "{{ status_tailscale_state if 'tailscale' in status_reads else none }}"
      probes: "{{ status_proxmox_probes.results | default([]) }}"
