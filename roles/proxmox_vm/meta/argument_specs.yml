---
argument_specs:
  main:
    short_description: Create Proxmox VE VMs and keep the settings it manages as configured
    description:
      - Downloads the ISOs of proxmox_vm_isos and the images of proxmox_vm_imports (checking each file's sha256),
        creates each VM of proxmox_vm_vms with qm, every option given, a disk with import_from imported from its
        image and grown to its size, and on later runs corrects its cores, memory, CPU type, ballooning,
        start-on-boot, startup order, watchdog, agent, tags, PCI and USB devices and CD-ROM, adds a configured disk
        it lacks and grows a disk configured larger. Starts a stopped VM marked start.
      - Never moves, shrinks or detaches a disk, never deletes a VM or an ISO, and never restarts a VM; a setting
        that waits for a restart is reported.
      - Refuses a VMID that belongs to another VM, a missing VM whose VMID still has disks or backups, a disk
        storage that does not exist or holds no images, and disks whose provisioned sizes would add up to more
        than a thin LVM, ZFS, directory or BTRFS storage holds, less proxmox_vm_host_headroom_gib on all but thin
        LVM. Warns when the VMs' memory would exceed the node's.
      - The defaults change nothing.
    options:
      proxmox_vm_vms:
        type: list
        elements: dict
        default: []
        description: >-
          VMs, each with vmid, name, cores, memory_mib, disks ({slot, storage, size_gib, serial, format, backup,
          import_from}) and net ({bridge, mac}); optional machine, bios, efidisk_storage, cpu, scsihw, iso, boot,
          watchdog, onboot, startup, tags, hostpci, usb, import_working_storage and start.
      proxmox_vm_isos:
        type: list
        elements: dict
        default: []
        description: >-
          ISOs to download, each with storage, filename, url and sha256 (the file's SHA-256, which Proxmox checks
          before keeping the download). Never deleted.
      proxmox_vm_imports:
        type: list
        elements: dict
        default: []
        description: >-
          Images a disk is imported from, downloaded as import content, each with storage, filename, url and
          sha256 (checked the same way). Never deleted.
      proxmox_vm_pending_storages:
        type: list
        elements: str
        default: []
        description: Storage ids an earlier role creates on a real run; reported as pending in check mode.
      proxmox_vm_pending_storages_hint:
        type: str
        default: ""
        description: >-
          What creates the pending storages, such as the play to run first: shown beside them in check mode, and
          when one is missing on a real run.
      proxmox_vm_allow_overcommit:
        type: bool
        default: false
        description: Let the disks on a thin LVM, ZFS, directory or BTRFS storage add up to more than it holds.
      proxmox_vm_host_headroom_gib:
        type: int
        default: 0
        description: >-
          GiB of a ZFS, directory or BTRFS storage's size kept out of the disk budget, for the host's own files
          that share its pool or filesystem.
      proxmox_vm_ignore_existing_volumes:
        type: bool
        default: false
        description: Create a missing VM even though its VMID still has disks or backups.
      proxmox_vm_rebuild_command:
        type: str
        default: ""
        description: >-
          How to run the role again with proxmox_vm_ignore_existing_volumes, named when a missing VM is refused over
          its old volumes. Empty means the play again with -e proxmox_vm_ignore_existing_volumes=true.
      proxmox_vm_node:
        type: str
        default: ""
        description: The node's name in Proxmox. Empty means the host's short hostname.
