---
# Neutral defaults: with nothing else set, the role changes nothing. The VMs and ISOs are configuration, set in
# inventory group_vars; see README.md.

# VMs, each: vmid, name, cores, memory_mib, disks ({slot, storage, size_gib, serial, format, backup,
# import_from}), net ({bridge, mac}), and optionally machine, bios, efidisk_storage, cpu, scsihw, iso, boot,
# watchdog ({model, action}), onboot, startup, tags, hostpci ([{mapping, pcie}]), usb ([{host or mapping, usb3}]),
# import_working_storage (where Proxmox extracts a disk out of an OVA) and start. A VM is created once, then
# corrected; a disk is only ever grown, and moved only when asked, the EFI disk too.
proxmox_vm_vms: []
# ISOs to download into a storage, each: storage, filename, url and sha256, which Proxmox checks before storing the
# file. Never deleted.
proxmox_vm_isos: []
# Images a disk is imported from (import_from), downloaded into a storage's import content, each: storage,
# filename, url and sha256, which Proxmox checks before storing the file. Never deleted.
proxmox_vm_imports: []
# Storage ids that an earlier role creates on a real run, such as the NFS storages proxmox_storage adds. A dry run
# on a fresh host reports a VM's missing storage from this list as pending instead of refusing it.
proxmox_vm_pending_storages: []
# What creates those storages, such as the play to run first: said beside them in a dry run, and when one is missing
# on a real run.
proxmox_vm_pending_storages_hint: ""
# On thin LVM, ZFS, a directory or BTRFS, the disks' provisioned sizes, other VMs' included, may not add up to more
# than the storage holds, or a full storage gives every VM on it I/O errors. True lets them.
proxmox_vm_allow_overcommit: false
# GiB of a ZFS, directory or BTRFS storage's size kept out of that budget: its pool or filesystem also holds the
# host's own files, its root filesystem among them on the installer's storage, and the storage's size shrinks as
# they grow.
proxmox_vm_host_headroom_gib: 0
# A missing VM whose VMID still has disks or backups somewhere is refused: it is being rebuilt, and would get new,
# empty disks beside the old ones. True builds it new anyway.
proxmox_vm_ignore_existing_volumes: false
# How to run the role again with proxmox_vm_ignore_existing_volumes, which that refusal names: the play's own just
# recipe, say. Empty: the play again with -e proxmox_vm_ignore_existing_volumes=true.
proxmox_vm_rebuild_command: ""
# A disk on another storage than its configuration says, the EFI disk too, is refused. True moves it there with qm
# disk move, the VM running or not, in the configured format, and deletes the old volume once the VM uses the copy.
proxmox_vm_move_disks: false
# How to run the role again with proxmox_vm_move_disks, which that refusal names. Empty: the play again with
# -e proxmox_vm_move_disks=true.
proxmox_vm_move_command: ""
# The Proxmox node's name. Empty means the host's short hostname, which is what Proxmox uses.
proxmox_vm_node: ""
# The power entry point (tasks_from: power): stopped shuts the VMs of proxmox_vm_power_vmids down, running starts
# them; empty does nothing. A shutdown that takes longer than proxmox_vm_power_timeout seconds fails.
proxmox_vm_power: ""
proxmox_vm_power_vmids: []
proxmox_vm_power_timeout: 180
