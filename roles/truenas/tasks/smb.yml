---
# The SMB service is this stage's alone, never the services stage's: the check that no SMB login the role does not
# list exists has to run in whatever run leaves SMB running, under whatever tag. It runs whenever SMB will run after
# this run, now or at the next boot, judged from what truenas_smb_service asks and, for what it leaves out, from what
# the connection read; so a run that stops SMB is never refused. It runs twice: first from what the connection read,
# so a refused run changes nothing, then just before a start, from the logins as the users task left them. A stop is
# the stage's first step, so no later failure keeps SMB running; a start is its last.
- name: smb | Configure SMB
  vars:
    _cifs: "{{ (truenas_state.services | default({})).cifs | default({}) }}"
    _running: "{{ (_cifs.state | default('')) == 'RUNNING' }}"
    _wanted: "{{ truenas_smb_service if truenas_smb_service is mapping else {} }}"
    _runs_after: >-
      {{ (_wanted.state | default('started' if _running else 'stopped')) == 'started'
         or (_wanted.enabled | default(_cifs.enable | default(false))) is true }}
    # Only when the role manages SMB at all: a stage given nothing does nothing, SMB run by hand included.
    _checks: >-
      {{ _runs_after and (truenas_smb_service is mapping or truenas_smb_shares | length > 0
                          or truenas_smb_settings | length > 0 or truenas_users | length > 0) }}
    _api_user: "{{ truenas_state.api_user | default('') | string }}"
    _remedy: >-
      Close each: name it in truenas_smb_closed_users (local.yml), which takes it out of SMB and leaves it otherwise
      alone.
  block:
    # First when it stops SMB, so that a failure later in the stage cannot keep SMB running.
    - name: smb | Stop or disable the SMB service
      truenas_service:  # noqa: args
        services: {cifs: "{{ truenas_smb_service }}"}
      when: truenas_smb_service is mapping and not _runs_after

    - name: smb | Refuse an SMB login the role does not list
      ansible.builtin.assert:
        that:
          - _seen is not none
          - _strays | length == 0
        fail_msg: >-
          {{ ('SMB logins that the role does not list: ' ~ _strays | join(', ') ~ '. '
              ~ ('SMB is running, so they can log in over the network now. ' if _running
                 else 'Starting SMB would let them log in over the network. ')
              ~ ((_api_user ~ " is the API key's own user: set truenas_api_user_smb to false to take it out of SMB. ")
                 if _api_user in (_strays | list) else '')
              ~ _remedy)
             if _seen is not none else
             "The connection's reading of the SMB logins is missing (was truenas_info skipped?), so the stage stops "
             ~ 'rather than leave SMB to run unchecked.' }}
        quiet: true
      vars:
        # A login this run creates, closes or takes out of SMB is one the role lists.
        _seen: "{{ truenas_state.smb_users | default(none) }}"
        _listed: >-
          {{ truenas_users | map(attribute='username') | list + truenas_smb_closed_users
             + ([_api_user] if truenas_api_user_smb is false else []) }}
        _strays: "{{ [] if _seen is none else _seen | difference(_listed) }}"
      when: _checks

    - name: smb | Apply the SMB service settings
      truenas_config:  # noqa: args
        namespace: smb
        settings: "{{ truenas_smb_settings }}"
      when: truenas_smb_settings | length > 0

    # Also whenever SMB is to run, for the logins as they stand after it, which the second check reads.
    - name: smb | Create or correct the users
      truenas_user:  # noqa: args
        users: "{{ truenas_users }}"
        passwords: "{{ truenas_user_passwords }}"
        users_reset: "{{ truenas_users_reset }}"
        smb_closed_users: "{{ truenas_smb_closed_users }}"
        api_user_smb: "{{ omit if truenas_api_user_smb is none else truenas_api_user_smb }}"
      register: truenas_smb_logins
      when: >-
        _checks or truenas_users | length > 0 or truenas_smb_closed_users | length > 0
        or truenas_api_user_smb is not none

    - name: smb | Give each share's directory its owner
      truenas_permission:  # noqa: args
        entries: "{{ truenas_permissions }}"
        # The datasets this run makes, which a dry run cannot stat yet: missing now, and only when the datasets stage
        # runs too, so that under --tags truenas_smb a missing dataset fails the dry run as it would the run.
        created_paths: >-
          {{ (truenas_datasets | map(attribute='name') | reject('in', truenas_state.datasets | default([]))
              | map('regex_replace', '^', '/mnt/') | list)
             if ('all' in ansible_run_tags or 'truenas_datasets' in ansible_run_tags)
                and 'truenas_datasets' not in ansible_skip_tags else [] }}
      when: truenas_permissions | length > 0

    - name: smb | Create or update the SMB shares
      truenas_resource:  # noqa: args
        namespace: sharing.smb
        key: [name]
        entries: "{{ truenas_smb_shares }}"
        update_together: [purpose, options]
      when: truenas_smb_shares | length > 0

    - name: smb | Refuse an SMB login the role does not list, as the logins now stand
      ansible.builtin.assert:
        that: _strays | length == 0
        fail_msg: >-
          After the users task, SMB logins that the role does not list: {{ _strays | join(', ') }}.
          {{ 'SMB is running, so they can log in over the network now.' if _running
             else 'Starting SMB would let them log in over the network.' }} {{ _remedy }}
        quiet: true
      vars:
        _strays: "{{ truenas_smb_logins.smb_users | difference(truenas_users | map(attribute='username') | list) }}"
      when: _checks

    - name: smb | Start or enable the SMB service
      truenas_service:  # noqa: args
        services: {cifs: "{{ truenas_smb_service }}"}
      when: truenas_smb_service is mapping and _runs_after
