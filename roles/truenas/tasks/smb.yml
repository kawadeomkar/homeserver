---
# The SMB service starts here, as the stage's last step, and never in the services stage: the check that no SMB login
# the role does not list exists has to run in whatever run starts SMB, under whatever tag.

# First, so a refused run changes nothing here. From what the connection read: a login this run creates or takes out
# of SMB is one the role lists.
- name: smb | Refuse an SMB login the role does not list
  ansible.builtin.assert:
    that: _strays | length == 0
    fail_msg: >-
      SMB logins that truenas_users does not list: {{ _strays | join(', ') }}. Starting SMB would let them log in
      over the network. {{ _api_note }}List each in truenas_users, with smb false to close it.
    quiet: true
  vars:
    _listed: "{{ truenas_users | map(attribute='username') | list + ([_api_user] if truenas_api_user_smb is false else []) }}"
    _strays: "{{ truenas_state.smb_users | default([]) | difference(_listed) }}"
    _api_user: "{{ truenas_state.api_user | default('') | string }}"
    _api_note: >-
      {{ (_api_user ~ " is the API key's own user: set truenas_api_user_smb to false to take it out of SMB. ")
         if _api_user in (_strays | list) else '' }}
  when: truenas_smb_shares | length > 0 or truenas_smb_services | length > 0

- name: smb | Apply the SMB service settings
  truenas_config:  # noqa: args
    namespace: smb
    settings: "{{ truenas_smb_settings }}"
  when: truenas_smb_settings | length > 0

- name: smb | Create or correct the users
  truenas_user:  # noqa: args
    users: "{{ truenas_users }}"
    passwords: "{{ truenas_user_passwords }}"
    reset_users: "{{ truenas_users_reset }}"
    api_user_smb: "{{ omit if truenas_api_user_smb is none else truenas_api_user_smb }}"
  when: truenas_users | length > 0 or truenas_api_user_smb is not none

- name: smb | Give each share's directory its owner
  truenas_permission:  # noqa: args
    entries: "{{ truenas_permissions }}"
  when: truenas_permissions | length > 0

- name: smb | Create or update the SMB shares
  truenas_resource:  # noqa: args
    namespace: sharing.smb
    key: [name]
    entries: "{{ truenas_smb_shares }}"
    defaults: "{{ truenas_smb_share_defaults }}"
    update_together: [purpose, options]
  when: truenas_smb_shares | length > 0

- name: smb | Start the SMB service
  truenas_service:  # noqa: args
    services: "{{ truenas_smb_services }}"
  when: truenas_smb_services | length > 0
