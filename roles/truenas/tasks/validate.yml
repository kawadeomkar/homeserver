---
# Allowed values and types are checked by meta/argument_specs.yml before this runs.

- name: validate | Check the connection settings
  ansible.builtin.assert:
    that:
      - truenas_api_key | length > 0
      - truenas_api_hosts | select | list | length > 0
    fail_msg: Set truenas_api_key and at least one address in truenas_api_hosts.
    quiet: true

- name: validate | Refuse to send the API key to an unproven server
  ansible.builtin.assert:
    that: truenas_validate_certs | bool or truenas_api_cert_sha256 | length > 0
    fail_msg: >-
      Certificate validation is off and truenas_api_cert_sha256 is empty, so nothing would prove that what answers
      is the NAS before the API key goes to it. Pin the certificate's SHA-256 (local.yml; the rebuild runbook says
      how to read it), or turn truenas_validate_certs on with a certificate the controller trusts.
    quiet: true

- name: validate | Check a static address has what it needs
  ansible.builtin.assert:
    that: truenas_static_address | length > 0 and truenas_gateway | length > 0
    fail_msg: truenas_network_mode static needs truenas_static_address (CIDR form) and truenas_gateway.
    quiet: true
  when: truenas_network_mode == 'static'

- name: validate | Refuse an NFS share open to every host
  ansible.builtin.assert:
    that: >-
      (_share.hosts | default([]) | select | list | length > 0)
      or (_share.networks | default([]) | select | list | length > 0)
    fail_msg: >-
      {{ item.path }} has no hosts or networks, so any device on the network could mount it and
      write to it. Give it hosts or networks.
    quiet: true
  loop: "{{ truenas_nfs_shares }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    _share: "{{ truenas_nfs_share_defaults | combine(item) }}"

# The SMB service is the SMB stage's, which starts it only after its login check; the services stage, which runs under
# its own tag without that check, must not touch it.
- name: validate | Refuse the SMB service among the services stage's
  ansible.builtin.assert:
    that: "'cifs' not in truenas_services"
    fail_msg: >-
      cifs is in truenas_services. The SMB service is the SMB stage's, which starts it only after checking that no SMB
      login the role does not list exists: set truenas_smb_service ({enabled, state}) instead.
    quiet: true

- name: validate | Refuse a truenas_api_user_smb that is not false or null
  ansible.builtin.assert:
    that: truenas_api_user_smb is none or truenas_api_user_smb is false
    fail_msg: >-
      truenas_api_user_smb is {{ truenas_api_user_smb | to_json }}: false takes the API key's user out of SMB, null
      leaves it alone, and true is refused, since turning SMB on needs that user's password. Given with -e, false is
      the string "false": write -e '{"truenas_api_user_smb": false}'.
    quiet: true
