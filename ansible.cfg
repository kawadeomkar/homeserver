[defaults]
inventory = inventory
vault_password_file = ./.vault_pass
interpreter_python = auto_silent
retry_files_enabled = false
callback_result_format = yaml
# The default output, with what the roles recorded as left to do (NEXT STEPS) after the play recap
# (callback_plugins/homeserver.py). Named with its directory, so a playbook in any directory finds it: Ansible
# stops a run whose stdout callback it cannot load.
stdout_callback = homeserver
callback_plugins = callback_plugins
# The documentation fragment roles/truenas's modules extend, for ansible-doc (just lint docs).
doc_fragment_plugins = roles/truenas/doc_fragments

[ssh_connection]
pipelining = true
