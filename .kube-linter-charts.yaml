---
# kube-linter on what the charts render (make lint-helm): only what every chart here must do, which this repo's
# own manifests must too: request CPU and memory, and run pinned images, never pulled with Always. A chart's
# privilege and host paths are pinned by tests/policy/test_k8s.py instead, since several are privileged by
# design (MetalLB's speaker, the CSI node plugin).
checks:
  doNotAutoAddDefaults: true
  include:
    - unset-cpu-requirements
    - latest-tag
    - no-pull-always
    - unset-memory-request
customChecks:
  - name: no-pull-always
    description: imagePullPolicy Always defeats tag pinning (CLAUDE.md)
    remediation: Pin the image to an immutable tag and leave imagePullPolicy unset.
    template: image-pull-policy
    params:
      forbiddenPolicies: [Always]
  - name: unset-memory-request
    description: Every container requests memory (CLAUDE.md)
    remediation: Set resources.requests.memory in the chart's values.
    template: memory-requirements
    params:
      requirementsType: request
      upperBoundMB: 0
