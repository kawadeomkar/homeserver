# The Python tooling this repo pins, managed with Poetry. poetry.lock is generated from this file by `make lock`; edit
# this file, never the lock, then run it. poetry.toml makes the lock take only releases at least 7 days old, as
# Dependabot does, so a pin here that is younger than that fails to resolve until it has aged.

[project]
name = "homeserver"
description = "The Python tooling for this homelab's Ansible: the playbooks' runtime, the linters and the tests."
# ansible-core 2.21's controller range, the Pythons CI tests. Poetry locks for every version in it at once, with
# environment markers, so one lock serves each of them.
requires-python = ">=3.12,<3.15"
# What `make truenas` and `make proxmox` need on the controller.
dependencies = [
    "ansible-core==2.21.4",
    # Used on the controller by roles/truenas to talk to the TrueNAS WebSocket API.
    "websocket-client==1.9.2",
]

[dependency-groups]
# The linters, the tests and the git hooks: `make lint`, `make test-idempotence`, `make init`.
dev = [
    "ansible-lint==26.9.0",
    "yamllint==1.38.0",
    "pytest==9.1.1",
    # Coverage of the in-process tests in `make test`: a report, not a gate (.coveragerc).
    "pytest-cov==7.1.0",
    # Lints and formats the Python, configured in ruff.toml.
    "ruff==0.16.9",
    # Used by tests/integration/fake_truenas.py, the stand-in NAS for the idempotence tests.
    "websockets==17.1",
    # Validates .github/dependabot.yml and the workflows against SchemaStore's schemas, which it bundles.
    "check-jsonschema==0.38.2",
    # Runs the git hooks in .pre-commit-config.yaml, which `make init` installs.
    "pre-commit==4.6.2",
]

[tool.poetry]
# Not a Python package: Poetry manages the dependencies and installs nothing else.
package-mode = false
# The Poetry this project needs, which each user installs (CI pins one in ci.yml). solver.min-release-age (poetry.toml)
# is new in 2.4.0, and 2.4.2 stopped installing artifacts the lock does not list. A range, not a pin: Dependabot
# re-locks with a Poetry of its own, and opens no pull request when that one falls outside it.
requires-poetry = ">=2.4.2,<3"
