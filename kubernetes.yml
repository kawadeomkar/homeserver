---
# Build the Kubernetes cluster: its VMs on the Proxmox host, then Talos on them and Flux from this machine. Check
# first:
#   make check-kubernetes        (or: ansible-playbook kubernetes.yml --check --diff)
# Without a cluster (no kubernetes_node_addresses in group_vars/all/local.yml) nothing happens: no VM is created,
# and the second play ends by itself. Run proxmox.yml first, so the storages the VMs' disks go on exist. The first
# play finds the GPU the worker is given, as proxmox.yml does (roles/proxmox_gpu), so a card added or taken out is
# followed by this run alone; the second reads which it found. Moving a running cluster to new pins is
# talos-upgrade.yml's job, never this one's.
- name: Create the cluster's VMs
  hosts: proxmox
  gather_facts: false
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    # make init copies inventory.example only when there is no inventory, and one made before the cluster has no
    # kubernetes group: the VMs would be created and the play that builds Talos on them would match no host.
    - name: Refuse a cluster without the kubernetes inventory group
      ansible.builtin.assert:
        that: not kubernetes_present or (groups['kubernetes'] | default([]) | length == 1)
        fail_msg: >-
          The inventory needs the kubernetes group with its one host: add [kubernetes] and homeserver-k8s to
          inventory, as in inventory.example.
        quiet: true
      tags: [always]
  roles:
    - role: proxmox_gpu
    - role: proxmox_vm

- name: Build Talos on the cluster's VMs
  hosts: kubernetes
  gather_facts: false
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Say why the cluster is skipped
      ansible.builtin.debug:
        msg: No kubernetes_node_addresses in group_vars/all/local.yml, so this setup has no cluster.
      when: not kubernetes_present
      tags: [always]
    - name: Skip the cluster when local.yml names no nodes
      ansible.builtin.meta: end_host
      when: not kubernetes_present
      tags: [always]
  roles:
    - role: talos
    - role: flux_bootstrap
