---
# This Proxmox host's storage, applied by roles/proxmox_storage. The NAS's address comes from
# group_vars/all/local.yml, the VM storage layout and the NAS switch from group_vars/all/storage.yml.

# The NFS storages mount the NAS at its static address. The bootstrap address is a DHCP lease that the NAS
# play replaces, so it is never used here: with only that address, the role refuses to run, naming this
# variable.
proxmox_storage_nfs_server: "{{ truenas_static_address | default('', true) | trim | split('/') | first }}"
# With a NAS, its two shares; without one, nothing to add.
proxmox_storage_nfs: "{{ vm_storage_nfs_exports if nas_present else [] }}"
# Without a NAS, the installer's storage, which is then the ephemeral class and the only one, must be able to
# hold VM disks: local-lvm, or proxmox_local_vm_storage from local.yml (see group_vars/all/storage.yml). That
# is the variable to change when the role refuses the storage.
proxmox_storage_local: "{{ [] if nas_present else [vm_storage.ephemeral.proxmox_id] }}"
# Pinned so an upgrade on either side cannot silently change the protocol version. nconnect is
# left out until it has been measured.
proxmox_storage_nfs_options: vers=4.2
# The NAS boots more slowly than Proxmox; VMs marked start-on-boot wait this long after a power cut.
# Without a NAS there is nothing to wait for, and the node's setting is left alone.
proxmox_storage_startall_delay: "{{ 120 if nas_present else none }}"
