---
# The Kubernetes cluster's VMs on this Proxmox host, applied by roles/proxmox_vm from kubernetes.yml's first play.
# The nodes, their sizes and their storages come from group_vars/all/kubernetes.yml, the MACs from local.yml.
# Without a cluster, nothing: no VM and no ISO.

# Every node first boots the Talos ISO, built by the Image Factory from the pinned version and schematic. The
# version and schematic are in the file name, so a new pin is a new file; the old one stays until removed by
# hand, which the role's report suggests once no VM uses it. It goes on kubernetes_iso_storage
# (group_vars/all/kubernetes.yml, so local.yml can name another).
kubernetes_iso_filename: "talos-{{ talos_version }}-{{ kubernetes_iso_schematic[:8] }}-metal-amd64.iso"
proxmox_vm_isos: >-
  {{ [{'storage': kubernetes_iso_storage, 'filename': kubernetes_iso_filename,
       'url': 'https://factory.talos.dev/image/' ~ kubernetes_iso_schematic ~ '/' ~ talos_version ~ '/metal-amd64.iso',
       'sha256': kubernetes_iso_sha256}]
     if kubernetes_present else [] }}

# The bridge the installer creates.
kubernetes_bridge: vmbr0

# On a ZFS install the installer's storage shares rpool with the host's root filesystem, and on a BTRFS install or a
# directory storage it is that filesystem: its size, which the disk budget counts against, shrinks as the host's own
# files grow, so 16 GiB of it stays out of the budget for the host.
proxmox_vm_host_headroom_gib: 16

# One VM per node, the same two in both setups. With a NAS, every disk on it in qcow2: the control plane's system
# disk and the worker's data disk, which holds the apps' local volumes, on the persistent storage, the worker's
# system disk on the ephemeral one (kubernetes_system_storage, group_vars/all/kubernetes.yml). Without one, every disk
# on the installer's storage, the worker's media disk among them, never backed up. The EFI disks stay on the
# installer's storage in both setups: 4 MiB each. A built cluster moved to the other
# setup is refused by proxmox_vm before anything changes, its disks being on the other storages, until run with
# proxmox_vm_move_disks (README.md, "Switching setups"). Each sits in its slot of kubernetes_disk_slots, whose by-id
# link Talos's disk selectors match; the serials only name the disks for whoever reads the VM's configuration. The
# CD-ROM always holds the current ISO, so a node whose system disk is wiped reaches maintenance mode from it; it boots
# from its system disk first. The control plane starts first, and the worker gets the host's iGPU when local.yml
# names its PCI mapping (kubernetes_gpu_mapping).
proxmox_vm_vms: >-
  {%- set out = [] -%}
  {%- for n in kubernetes_nodes if kubernetes_present -%}
  {%-   set disks = [{'slot': kubernetes_disk_slots.system, 'storage': kubernetes_system_storage[n.role],
                      'size_gib': n.system_disk_gib, 'serial': 'talos-system'}
                     | combine({'format': 'qcow2'} if nas_present else {})] -%}
  {%-   if n.data_disk_gib | default(0) | int > 0 -%}
  {%-     set _ = disks.append({'slot': kubernetes_disk_slots.data, 'storage': kubernetes_data_storage,
                                'size_gib': n.data_disk_gib, 'serial': 'talos-data'}
                               | combine({'format': 'qcow2'} if nas_present else {})) -%}
  {%-   endif -%}
  {%-   if n.media_disk_gib | default(0) | int > 0 -%}
  {%-     set _ = disks.append({'slot': kubernetes_disk_slots.media, 'storage': vm_storage_installer,
                                'size_gib': n.media_disk_gib, 'serial': 'talos-media', 'backup': false}) -%}
  {%-   endif -%}
  {%-   set gpu = kubernetes_gpu_mapping | default('', true) and n.name == kubernetes_data_node -%}
  {%-   set _ = out.append({
          'vmid': n.vmid, 'name': n.name, 'cores': n.cores, 'memory_mib': n.memory_mib,
          'machine': 'q35', 'bios': 'ovmf', 'efidisk_storage': vm_storage_installer, 'cpu': 'host',
          'scsihw': 'virtio-scsi-pci', 'disks': disks,
          'net': {'bridge': kubernetes_bridge, 'mac': kubernetes_node_macs[n.name]},
          'iso': kubernetes_iso_storage ~ ':iso/' ~ kubernetes_iso_filename, 'boot': 'order=' ~ kubernetes_disk_slots.system ~ ';ide2',
          'watchdog': {'model': 'i6300esb', 'action': 'reset'}, 'onboot': true,
          'startup': 'order=' ~ ('1' if n.role == 'controlplane' else '2') ~ ',up=60,down=120',
          'tags': ['talos', 'k8s'],
          'hostpci': [{'mapping': kubernetes_gpu_mapping, 'pcie': true}] if gpu else [],
          'start': true}) -%}
  {%- endfor -%}
  {{ out }}

# The persistent NAS storage is added by proxmox_storage in the Proxmox play, never by this one: a dry run on a fresh
# host reports it as pending, and both that and a real run without it say to run just deploy proxmox first.
proxmox_vm_pending_storages: "{{ proxmox_storage_nfs | map(attribute='id') | list }}"
proxmox_vm_pending_storages_hint: "just deploy proxmox adds it: run that first"
# What a VM refused over its VMID's old disks or backups is built new with, on purpose (scripts/runbooks/vm-restore.md
# restores it instead).
proxmox_vm_rebuild_command: "just deploy kubernetes -e proxmox_vm_ignore_existing_volumes=true"
# What moves a disk that is on another storage than configured, as when the cluster changes setup.
proxmox_vm_move_command: "just deploy kubernetes -e proxmox_vm_move_disks=true"
