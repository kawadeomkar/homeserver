---
# just status on the cluster (roles/status's main entry point, on this machine): read with the credentials
# roles/talos writes, refusing another cluster's as roles/app_scale does, its apps found as just suspend finds them,
# the worker's Talos user volumes by their mount (talos_nodes, group_vars/kubernetes/talos.yml), the settings
# roles/flux_bootstrap keeps, Alertmanager's pod (kube-prometheus-stack's, k8s/infrastructure/monitoring/), the
# pins just talos-upgrade moves the nodes to, and the etcd snapshots. Without a cluster it reads nothing.
status_source: "{{ 'cluster' if kubernetes_present else '' }}"
status_cluster_kubeconfig: "{{ talos_config_dir }}/kubeconfig"
status_cluster_talosconfig: "{{ talos_config_dir }}/talosconfig"
status_cluster_server: "{{ talos_endpoint if kubernetes_present else '' }}"
status_cluster_nodes: >-
  {%- set out = [] -%}
  {%- for n in kubernetes_nodes -%}
  {%-   set _ = out.append({'name': n.name, 'role': n.role}) -%}
  {%- endfor -%}
  {{ out }}
status_cluster_apps_path: "{{ app_scale_path }}"
status_cluster_annotation: "{{ app_scale_annotation }}"
status_cluster_database_label: "{{ app_scale_late_label }}"
# Talos mounts a user volume at /var/mnt/<its name>.
status_cluster_volumes:
  /var/mnt/local-path-provisioner: data
  /var/mnt/media: media
status_cluster_settings:
  namespace: flux-system
  name: cluster-settings
  allowlist: INGRESS_ALLOWED_RANGE
status_cluster_alertmanager:
  namespace: monitoring
  pod: alertmanager-kube-prometheus-stack-alertmanager-0
status_cluster_flux_url: "{{ flux_sync_url | default('', true) if kubernetes_present else '' }}"
status_cluster_flux_ref: "{{ flux_sync_ref | default('refs/heads/main', true) }}"
status_cluster_pins:
  talos: "{{ talos_version }}"
  kubernetes: "{{ talos_kubernetes_version }}"
# Where this machine's Tailscale sends the apps' domain, read with the cluster whenever the Proxmox host runs Tailscale
# (the switch group_vars/proxmox/tailscale.yml works out, here from local.yml alike): the filter then shows it only
# for a route the host really advertises, as its Tailscale says, whatever local.yml lists today.
status_tailnet_dns: "{{ tailscale_enabled | default(tailscale_advertise_routes | default([], true) | length > 0) }}"
# Where roles/talos keeps the etcd snapshots just etcd-snapshot and just talos-upgrade take.
status_cluster_snapshot_dir: "{{ talos_config_dir }}/etcd"
# A cluster that does not answer should not hold the report up for long: kubectl gives up after its own 10 seconds,
# and every read runs at once, each a light client on this machine, so that such a cluster costs one wait, not two
# (its 16 reads took 10.5 s 8 at a time when its API refused connections, each giving up after 5 s, 2026-11-17).
status_timeout: 15
status_parallel: 32
