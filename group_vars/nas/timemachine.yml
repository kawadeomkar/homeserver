---
# Time Machine on the NAS, from local.yml's timemachine_backups (group_vars/all/timemachine.yml): for each Mac a dataset,
# a weekly snapshot task, an SMB-only login, its directory's owner and a Time Machine share, all tm-<name> or <name>, and
# the SMB service, which roles/truenas's SMB stage starts after checking that no SMB login it does not list exists.
# Everything here is empty without a Mac, so the stage does nothing. group_vars/nas/truenas.yml takes the datasets, the
# snapshot tasks and the announcements in, and keeps the SMB service stopped while there is no Mac to back up.

# The Macs' datasets sit under one of their own on the redundant pool: a backup's history cannot be re-created.
timemachine_dataset_root: "{{ nas_pools.persistent }}/timemachine"

# The SMB preset (share_type SMB) is applied when a dataset is created, the only moment case-insensitivity can be
# chosen; Samba would otherwise scan a directory of thousands of band files to match a name. Compression, atime and the
# record size are inherited from the pool's root: an encrypted disk image does not compress, and its bands are
# rewritten in place. sync stays STANDARD, as there is no UPS and Time Machine asks for its data on stable storage. The
# quota, which counts the snapshots, is the backstop; the Mac's own limit, about half of it, is the working one.
truenas_datasets_timemachine: >-
  {%- set out = [] -%}
  {%- if timemachine_present -%}
  {%-   set _ = out.append({'name': timemachine_dataset_root, 'share_type': 'SMB'}) -%}
  {%-   for mac in timemachine_macs -%}
  {%-     set _ = out.append({'name': timemachine_dataset_root ~ '/' ~ mac.name, 'share_type': 'SMB',
                            'properties': {'quota': (mac.quota_gib | int) * 1073741824, 'sync': 'STANDARD'}}) -%}
  {%-   endfor -%}
  {%- endif -%}
  {{ out }}

# A weekly snapshot of each Mac's dataset, kept eight weeks, beside the ones Samba takes after every completed backup and
# keeps a week (the share's auto_snapshot): damage can go unnoticed for longer, since Time Machine verifies a network
# backup only now and then. Disabled for a retired Mac, so its snapshots are neither taken nor expired.
truenas_snapshot_tasks_timemachine: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs -%}
  {%-   set _ = out.append({'dataset': timemachine_dataset_root ~ '/' ~ mac.name,
                            'naming_schema': 'weekly-%Y-%m-%d_%H-%M', 'lifetime_value': 8, 'lifetime_unit': 'WEEK',
                            'allow_empty': true, 'recursive': false, 'enabled': not (mac.retired | default(false)),
                            'schedule': {'minute': '00', 'hour': '00', 'dom': '*', 'month': '*', 'dow': '7'}}) -%}
  {%- endfor -%}
  {{ out }}

# The SMB service with a Mac. aapl_extensions is required for a Time Machine share. Transport encryption is required,
# which makes signing mandatory too: the LAN is flat, and signing stops a relayed or tampered session. SMB1 and NTLMv1
# stay off; multichannel stays off (one network path, and the setting a reported smbfs kernel panic suspected); no
# master-browser election, which serves Windows clients.
truenas_smb_settings: >-
  {{ {'aapl_extensions': true, 'encryption': 'REQUIRED', 'enable_smb1': false, 'ntlmv1_auth': false,
      'multichannel': false, 'localmaster': false} if timemachine_present else {} }}

# A login per Mac, for SMB alone: no shell, no home. Its uid is pinned, so a reinstalled NAS that imports the pool gives
# the files back to the same number. A retired Mac's login is closed: out of SMB, locked, without a password.
truenas_users: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs -%}
  {%-   set retired = mac.retired | default(false) -%}
  {%-   set _ = out.append({'username': 'tm-' ~ mac.name, 'uid': mac.uid | int, 'full_name': 'Time Machine, ' ~ mac.name,
                            'smb': not retired, 'shell': '/usr/sbin/nologin', 'locked': retired,
                            'password_disabled': retired}) -%}
  {%- endfor -%}
  {{ out }}
# Set when a login is made, and after that only with -e '{"truenas_users_reset": ["tm-<name>"]}'.
truenas_user_passwords: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_active -%}
  {%-   set _ = out.append({'key': 'tm-' ~ mac.name,
                            'value': vault_timemachine_passwords[mac.name] | default('', true)}) -%}
  {%- endfor -%}
  {{ out | items2dict }}
# The API key's user is a full administrator, and today an SMB login too: out of SMB before the service starts.
truenas_api_user_smb: "{{ false if timemachine_present else none }}"

# One owner and 0700 on each Mac's directory, the SMB preset's template ACL stripped: in it, every SMB login could
# modify any Mac's backup.
truenas_permissions: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs -%}
  {%-   set _ = out.append({'path': vm_storage_mount_root ~ '/' ~ timemachine_dataset_root ~ '/' ~ mac.name,
                            'user': 'tm-' ~ mac.name, 'group': 'tm-' ~ mac.name, 'mode': '700'}) -%}
  {%- endfor -%}
  {{ out }}

# A Time Machine share per Mac. auto_snapshot has Samba snapshot the dataset a minute after each completed backup
# (aapltm-<epoch>, kept 7 days). No dataset made by Samba at the first connection (auto_dataset_creation), and no size
# the share reports (timemachine_quota): the Mac sets its own limit. The vuid names the volume in the share's Bonjour
# record, and TrueNAS would make a random one: it is derived from the Mac's name instead (a UUID5), so a share a rebuilt
# NAS makes again is the volume the Mac knows. A retired Mac's share is disabled.
truenas_smb_shares: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs -%}
  {%-   set _ = out.append({'name': 'tm-' ~ mac.name,
                            'path': vm_storage_mount_root ~ '/' ~ timemachine_dataset_root ~ '/' ~ mac.name,
                            'purpose': 'TIMEMACHINE_SHARE', 'comment': 'Time Machine, ' ~ mac.name,
                            'enabled': not (mac.retired | default(false)),
                            'options': {'auto_snapshot': true, 'auto_dataset_creation': false,
                                        'timemachine_quota': 0,
                                        'vuid': ('homeserver-timemachine-' ~ mac.name) | to_uuid}}) -%}
  {%- endfor -%}
  {{ out }}

# Started by the SMB stage while a Mac backs up; once every Mac is retired, group_vars/nas/truenas.yml stops it.
truenas_smb_services: "{{ {'cifs': {'enabled': true, 'state': 'started'}} if timemachine_active else {} }}"
