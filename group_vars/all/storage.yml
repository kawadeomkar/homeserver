---
# The VM storage layout, read by both plays: the NAS play creates and exports each dataset, and the
# Proxmox play mounts it as a storage. Defined once so a share and the storage that mounts it
# cannot drift apart. Names only; addresses live in local.yml.

# Where TrueNAS mounts its pools.
vm_storage_mount_root: /mnt

# One entry per VM class: the dataset holding its disks and the Proxmox storage id for it.
vm_storage:
  # Long-term data: on the redundant pool, synchronous writes honoured.
  persistent:
    dataset: nvme_gen3/proxmox/vm
    proxmox_id: truenas-persistent
  # Throwaway Claude-session VMs: on the single-disk pool, all data gone when the VM is destroyed.
  ephemeral:
    dataset: ephemeral/proxmox/vm
    proxmox_id: truenas-ephemeral
