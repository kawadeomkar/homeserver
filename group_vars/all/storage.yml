---
# The VM storage layout, read by both plays: the NAS play creates and exports each dataset, and the
# Proxmox play mounts it as a storage. Defined once so a share and the storage that mounts it
# cannot drift apart. Names only; addresses live in local.yml. This file also holds the switch between
# a setup with a NAS and one without.

# True when this setup has a NAS, which is the case when local.yml gives it an address. With a NAS, VM
# disks live on its datasets below, over NFS; without one, they stay on the Proxmox host's own storage,
# and the NAS play ends before it does anything. A value left blank (YAML null) or only whitespace is no
# address, wherever the two addresses are read. Worked out, never set: the addresses are the switch.
nas_present: "{{ (truenas_static_address | default('', true) | trim | length > 0)
                 or (truenas_bootstrap_address | default('', true) | trim | length > 0) }}"

# Empty unless local.yml's TrueNAS section keeps other settings but gives neither address. That is what a
# misspelt address looks like, and it would otherwise pass for a setup without a NAS, so both playbooks
# refuse to run (the first pre-task of truenas.yml and of proxmox.yml). A value left blank counts as unset,
# so a section with every value blank still means no NAS. It also refuses nas_present given on the command
# line, as in -e nas_present=false: that makes it the string "false", which counts as true. With a NAS, it refuses
# alert mail TrueNAS would refuse: a mail server without a sender address (truenas_mail_from, or truenas_mail_user
# when that is an address), and an alert address without a mail server to send through.
nas_section_error: >-
  {%- set given = {'truenas_api_cert_sha256': truenas_api_cert_sha256 | default(''),
                   'truenas_gateway': truenas_gateway | default(''),
                   'truenas_nameservers': truenas_nameservers | default(''),
                   'truenas_pool_disks': truenas_pool_disks | default(''),
                   'truenas_pool_persistent': truenas_pool_persistent | default(''),
                   'truenas_pool_ephemeral': truenas_pool_ephemeral | default(''),
                   'truenas_mail_server': truenas_mail_server | default(''),
                   'truenas_mail_port': truenas_mail_port | default(''),
                   'truenas_mail_security': truenas_mail_security | default(''),
                   'truenas_mail_user': truenas_mail_user | default(''),
                   'truenas_mail_from': truenas_mail_from | default(''),
                   'truenas_alert_email': truenas_alert_email | default('')}
                  | dict2items | selectattr('value') | map(attribute='key') | list -%}
  {%- set sender = truenas_mail_from | default('', true) or truenas_mail_user | default('', true) -%}
  {%- set mail = [] -%}
  {%- if truenas_mail_server | default('', true) and (sender | string | trim) is not match('^[^@\\s]+@[^@\\s]+$') -%}
  {%-   set _ = mail.append('group_vars/all/local.yml sets truenas_mail_server but no sender address: set '
                            ~ 'truenas_mail_from, or truenas_mail_user when it is an address, since TrueNAS refuses '
                            ~ 'mail settings without one.') -%}
  {%- endif -%}
  {%- if truenas_alert_email | default('', true) and not truenas_mail_server | default('', true) -%}
  {%-   set _ = mail.append('group_vars/all/local.yml sets truenas_alert_email but no truenas_mail_server for the '
                            ~ 'alerts to go through: set it, or remove the alert address.') -%}
  {%- endif -%}
  {{ 'nas_present is worked out from the NAS addresses in group_vars/all/local.yml, not set: given with -e it '
     ~ 'is a string, which counts as true whatever it says. To run without a NAS, delete the TrueNAS section '
     ~ 'there or leave its values blank.' if nas_present is not boolean else
     mail | join(' ') if nas_present else
     '' if not given else
     'group_vars/all/local.yml sets ' ~ given | join(', ') ~ ' but neither truenas_static_address nor '
     ~ 'truenas_bootstrap_address, which usually means one of them is misspelt. Correct it, or delete the '
     ~ 'whole TrueNAS section to run without a NAS.' }}

# The NAS's address, for whatever mounts its shares: Proxmox's NFS storages and the cluster's volumes. Its static
# address, never the bootstrap one, which is a DHCP lease the NAS play replaces. Empty without a NAS.
nas_address: "{{ truenas_static_address | default('', true) | trim | split('/') | first }}"

# Where TrueNAS mounts its pools.
vm_storage_mount_root: /mnt

# The NAS's two pools, named for what they hold, never for the hardware behind them: persistent is redundant,
# for data that cannot be re-created, and ephemeral has no redundancy, for data that can. A setup whose pools
# are called something else names them in local.yml (truenas_pool_persistent, truenas_pool_ephemeral). Read
# here and never set here, like proxmox_local_vm_storage below.
nas_pools:
  persistent: "{{ truenas_pool_persistent | default('persistent', true) | trim }}"
  ephemeral: "{{ truenas_pool_ephemeral | default('ephemeral', true) | trim }}"

# Without a NAS, the ephemeral class uses the storage the Proxmox installer created: local-lvm on an LVM
# install, or whatever local.yml names as proxmox_local_vm_storage (local-zfs on a ZFS install). It is
# read here and never set: a group_vars/all/ directory is read alphabetically and the last file wins, so a
# value set in this file would silently override local.yml's.

# Every VM class this layout knows: the dataset holding its disks and the Proxmox storage id for it. Ids say
# who owns a storage and what it is for, never what is behind it, so a project told an id learns nothing
# about the backend and the id never changes with it. Only the classes a setup has appear in vm_storage.
vm_storage_classes:
  # Long-term data: on the redundant pool, synchronous writes honoured. Exists only with a NAS.
  persistent:
    dataset: "{{ nas_pools.persistent }}/proxmox/vm"
    proxmox_id: homeserver-persistent
  # Throwaway VMs: on the single-disk pool, all data gone when the VM is destroyed. Without a NAS this is
  # the storage the Proxmox installer created, and the only VM storage there is.
  ephemeral:
    dataset: "{{ nas_pools.ephemeral }}/proxmox/vm"
    proxmox_id: "{{ 'homeserver-ephemeral' if nas_present else proxmox_local_vm_storage | default('local-lvm') }}"
vm_storage: "{{ vm_storage_classes if nas_present else {'ephemeral': vm_storage_classes.ephemeral} }}"

# Space on the ephemeral pool kept for the VMs, with a NAS: a ZFS reservation on the dataset above both the
# ephemeral class and the project pools, which counts what they hold, so the media dataset on the same pool can
# never fill it under them. The quota caps the VMs; this guarantees them room. Bytes, or a binary suffix (200G);
# null keeps none. Size it to what the VMs need, such as the sum of the project pools' quotas.
vm_storage_ephemeral_reservation: null

# The VMs' backups, with a NAS: a dataset on the redundant pool, exported to the Proxmox host and mounted as a
# storage that holds backups only. Without a NAS, the backups go wherever local.yml's vm_backup_storage says.
vm_storage_backup:
  dataset: "{{ nas_pools.persistent }}/proxmox/backup"
  proxmox_id: homeserver-backup

# One storage pool per project that creates VMs on the Proxmox host, with a NAS: a dataset of its own on the
# ephemeral pool, exported like the classes, so the project's token can be granted its pool alone and a quota
# can cap it. A project is told the id and nothing else; it never creates storage and never reads this file.
# Without a NAS none of these exists, and a project uses its own default, the installer's storage. Adding a
# project is one more entry. quota is optional, in bytes or with a binary suffix (200G); the parent dataset's
# quota applies regardless.
vm_storage_consumers:
  - proxmox_id: claude-on-proxmox-ephemeral
    dataset: "{{ nas_pools.ephemeral }}/proxmox/claude-on-proxmox"

# The NAS's exports as Proxmox mounts them: the classes the setup has, then the project pools, then the backups,
# which hold nothing else. Read only when a NAS is present.
vm_storage_nfs_exports: >-
  {%- set out = [] -%}
  {%- for e in (vm_storage.values() | list) + vm_storage_consumers -%}
  {%-   set _ = out.append({'id': e.proxmox_id, 'export': vm_storage_mount_root ~ '/' ~ e.dataset}) -%}
  {%- endfor -%}
  {%- set _ = out.append({'id': vm_storage_backup.proxmox_id, 'content': ['backup'],
                          'export': vm_storage_mount_root ~ '/' ~ vm_storage_backup.dataset}) -%}
  {{ out }}
