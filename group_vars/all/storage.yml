---
# The VM storage layout, read by both plays: the NAS play creates and exports each dataset, and the
# Proxmox play mounts it as a storage. Defined once so a share and the storage that mounts it
# cannot drift apart. Names only; addresses live in local.yml. This file also holds the switch between
# a setup with a NAS and one without.

# True when this setup has a NAS, which is the case when local.yml gives it an address. With a NAS, VM
# disks live on its datasets below, over NFS; without one, they stay on the Proxmox host's own storage,
# and the NAS play ends before it does anything. A value left blank (YAML null) or only whitespace is no
# address, wherever the two addresses are read. Worked out, never set: the addresses are the switch.
nas_present: "{{ (truenas_static_address | default('', true) | trim | length > 0)
                 or (truenas_bootstrap_address | default('', true) | trim | length > 0) }}"

# Empty unless local.yml's TrueNAS section keeps other settings but gives neither address. That is what a
# misspelt address looks like, and it would otherwise pass for a setup without a NAS, so both playbooks
# refuse to run (the first pre-task of truenas.yml and of proxmox.yml). A value left blank counts as unset,
# so a section with every value blank still means no NAS. It also refuses nas_present given on the command
# line, as in -e nas_present=false: that makes it the string "false", which counts as true.
nas_section_error: >-
  {%- set given = {'truenas_api_cert_sha256': truenas_api_cert_sha256 | default(''),
                   'truenas_gateway': truenas_gateway | default(''),
                   'truenas_nameservers': truenas_nameservers | default(''),
                   'truenas_pool_disks': truenas_pool_disks | default('')}
                  | dict2items | selectattr('value') | map(attribute='key') | list -%}
  {{ 'nas_present is worked out from the NAS addresses in group_vars/all/local.yml, not set: given with -e it '
     ~ 'is a string, which counts as true whatever it says. To run without a NAS, delete the TrueNAS section '
     ~ 'there or leave its values blank.' if nas_present is not boolean else
     '' if nas_present or not given else
     'group_vars/all/local.yml sets ' ~ given | join(', ') ~ ' but neither truenas_static_address nor '
     ~ 'truenas_bootstrap_address, which usually means one of them is misspelt. Correct it, or delete the '
     ~ 'whole TrueNAS section to run without a NAS.' }}

# Where TrueNAS mounts its pools.
vm_storage_mount_root: /mnt

# Without a NAS, the ephemeral class uses the storage the Proxmox installer created: local-lvm on an LVM
# install, or whatever local.yml names as proxmox_local_vm_storage (local-zfs on a ZFS install). It is
# read here and never set: a group_vars/all/ directory is read alphabetically and the last file wins, so a
# value set in this file would silently override local.yml's.

# Every VM class this layout knows: the dataset holding its disks and the Proxmox storage id for it. Ids say
# who owns a storage and what it is for, never what is behind it, so a project told an id learns nothing
# about the backend and the id never changes with it. Only the classes a setup has appear in vm_storage.
vm_storage_classes:
  # Long-term data: on the redundant pool, synchronous writes honoured. Exists only with a NAS.
  persistent:
    dataset: nvme_gen3/proxmox/vm
    proxmox_id: homeserver-persistent
  # Throwaway VMs: on the single-disk pool, all data gone when the VM is destroyed. Without a NAS this is
  # the storage the Proxmox installer created, and the only VM storage there is.
  ephemeral:
    dataset: ephemeral/proxmox/vm
    proxmox_id: "{{ 'homeserver-ephemeral' if nas_present else proxmox_local_vm_storage | default('local-lvm') }}"
vm_storage: "{{ vm_storage_classes if nas_present else {'ephemeral': vm_storage_classes.ephemeral} }}"

# The NAS's exports as Proxmox mounts them, one per class the setup has. Read only when a NAS is present.
vm_storage_nfs_exports: >-
  {%- set out = [] -%}
  {%- for e in vm_storage.values() -%}
  {%-   set _ = out.append({'id': e.proxmox_id, 'export': vm_storage_mount_root ~ '/' ~ e.dataset}) -%}
  {%- endfor -%}
  {{ out }}
