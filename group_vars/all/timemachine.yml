---
# Time Machine backups of the Macs on the NAS (scripts/runbooks/timemachine.md): local.yml's timemachine_backups, each
# Mac's SMB password from the vault's vault_timemachine_passwords, and the check truenas.yml asserts first. What the NAS
# is handed is derived in group_vars/nas/timemachine.yml. Both settings are read here and never set: group_vars/all/ is
# read alphabetically and the last file wins, so a value set in this file would override local.yml's.

# The Macs local.yml lists, retired ones included; none without the setting.
timemachine_macs: "{{ timemachine_backups | default([], true) }}"
# Whether any Mac backs up to the NAS, or did: its dataset, login and share are then the NAS's.
timemachine_present: "{{ timemachine_macs | length > 0 }}"
# The Macs that still back up. A retired one keeps its dataset and snapshots, its login and share closed.
timemachine_active: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs if mac is mapping and not (mac.retired | default(false)) -%}
  {%-   set _ = out.append(mac) -%}
  {%- endfor -%}
  {{ out }}

# What the playbooks refuse in the section, each message naming the Mac and never a password; empty when it passes.
timemachine_settings_error: >-
  {%- set errors = [] -%}
  {%- set macs = timemachine_backups | default([], true) -%}
  {%- set passwords = vault_timemachine_passwords | default({}, true) -%}
  {%- if macs is string or macs is mapping or macs is not iterable -%}
  {%-   set _ = errors.append('group_vars/all/local.yml: timemachine_backups is a list of Macs, each with name,'
                             ~ ' quota_gib and uid, such as [{name: laptop, quota_gib: 2048, uid: 3101}].') -%}
  {%- else -%}
  {%-   set names = [] -%}
  {%-   set uids = [] -%}
  {%-   for mac in macs -%}
  {%-     if mac is not mapping -%}
  {%-       set _ = errors.append('group_vars/all/local.yml: each entry of timemachine_backups is a Mac with name,'
                                 ~ ' quota_gib and uid.') -%}
  {%-     else -%}
  {%-       set name = mac.name | default('', true) | string -%}
  {%-       set label = 'timemachine_backups: ' ~ (name or 'an entry without a name') -%}
  {%-       if name is not match('^[a-z0-9][a-z0-9-]{0,15}$') -%}
  {%-         set _ = errors.append(label ~ ': the name must be 1 to 16 lower-case letters, digits and hyphens,'
                                   ~ ' starting with a letter or a digit: it names a dataset, a login and a share.') -%}
  {%-       elif name in names -%}
  {%-         set _ = errors.append(label ~ ' is given twice.') -%}
  {%-       endif -%}
  {%-       set _ = names.append(name) -%}
  {%-       set quota = mac.quota_gib | default(none) -%}
  {%-       if quota is not integer or quota is boolean or quota < 64 -%}
  {%-         set _ = errors.append(label ~ ': quota_gib must be a whole number of GiB, 64 or more: the most its'
                                   ~ ' dataset may hold, snapshots included.') -%}
  {%-       endif -%}
  {%-       set uid = mac.uid | default(none) -%}
  {%-       if uid is not integer or uid is boolean or uid < 3000 -%}
  {%-         set _ = errors.append(label ~ ": uid must be a whole number, 3000 or more, of its own: the login's,"
                                   ~ ' which a rebuilt NAS gives it again.') -%}
  {%-       elif uid in uids -%}
  {%-         set _ = errors.append(label ~ ': uid ' ~ uid ~ " is another Mac's too.") -%}
  {%-       endif -%}
  {%-       set _ = uids.append(uid) -%}
  {%-       set retired = mac.retired | default(false) -%}
  {%-       if retired is not boolean -%}
  {%-         set _ = errors.append(label ~ ': retired must be true or false.') -%}
  {%-       elif not retired and (passwords is not mapping
                                  or (passwords[name] | default('', true) | string | length) < 20) -%}
  {%-         set _ = errors.append(label ~ ': the vault has no SMB password of 20 characters or more for it under'
                                   ~ ' vault_timemachine_passwords (just vault).') -%}
  {%-       endif -%}
  {%-     endif -%}
  {%-   endfor -%}
  {%-   if passwords is not mapping -%}
  {%-     set _ = errors.append("the vault's vault_timemachine_passwords must be a mapping of each Mac's name to its SMB"
                               ~ ' password.') -%}
  {%-   else -%}
  {%-     for name in passwords if name not in names -%}
  {%-       set _ = errors.append("the vault's vault_timemachine_passwords has a password for " ~ name ~ ', which'
                                 ~ ' timemachine_backups does not list: remove it, or add the Mac.') -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%- endif -%}
  {{ errors }}
