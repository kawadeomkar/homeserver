---
# just status (status.yml, roles/status): what this setup has, the VMs it reports on and the Macs that back up to the
# NAS, which every play that reports reads. These are the VMs this repo makes, the same ones the nightly backup covers (vm_backup_vmids,
# group_vars/proxmox/backup.yml): the cluster's nodes, Home Assistant's, and local.yml's vm_backup_extra_vmids. Any
# other VM on the Proxmox host, another project's or one made by hand, is shown after them, never named as a problem.
status_setup:
  nas: "{{ nas_present }}"
  cluster: "{{ kubernetes_present }}"
  home_assistant: "{{ haos_present }}"
# Each with what makes it and what starts it, which the report suggests while it is missing or stopped, and whether
# its guest agent reports its filesystems: Home Assistant's does; Talos's lists none, so the nodes' memory and disks
# come from the cluster instead (node). Home Assistant is an app too, at haos_url or else the address its guest
# agent reports, on the port Home Assistant answers on.
status_vms: >-
  {%- set out = [] -%}
  {%- for n in kubernetes_nodes if kubernetes_present -%}
  {%-   set _ = out.append({'vmid': n.vmid | int, 'name': n.name, 'made_by': 'just deploy kubernetes',
                            'start': 'just resume --all', 'guest_agent': false, 'node': n.name}) -%}
  {%- endfor -%}
  {%- if haos_present -%}
  {%-   set _ = out.append({'vmid': haos_vm_vmid | int, 'name': 'homeassistant',
                            'made_by': 'just deploy homeassistant', 'start': 'just resume --only homeassistant',
                            'guest_agent': true,
                            'app': {'name': 'homeassistant', 'url': haos_url | default('', true), 'port': 8123}}) -%}
  {%- endif -%}
  {%- for vmid in vm_backup_extra_vmids | default([], true) | map('int')
        if vmid not in out | map(attribute='vmid') | list -%}
  {%-   set _ = out.append({'vmid': vmid, 'name': '', 'made_by': '', 'start': 'qm start ' ~ vmid,
                            'guest_agent': true}) -%}
  {%- endfor -%}
  {{ out }}
# The Macs that back up to the NAS with Time Machine, local.yml's timemachine_backups (group_vars/all/timemachine.yml),
# each by its share, tm-<name> as group_vars/nas/timemachine.yml names it, and whether it is retired: the report judges
# each Time Machine share by them, so a Mac is retired when local.yml says so, never because its share is disabled.
status_nas_macs: >-
  {%- set out = [] -%}
  {%- for mac in timemachine_macs if mac is mapping and mac.name | default('', true) -%}
  {%-   set _ = out.append({'share': 'tm-' ~ mac.name,
                            'retired': true if mac.retired | default(false) else false}) -%}
  {%- endfor -%}
  {{ out }}
# The machines of this setup by address, as local.yml gives them: the Proxmox host and each of the cluster's nodes. The
# report names who has the NAS's NFS shares mounted by them, and any other address is a problem. The Tailscale subnet
# router masquerades every tailnet client to the Proxmox host's address, so "the Proxmox host" may be the tailnet too.
status_nas_known_clients: >-
  {%- set out = [] -%}
  {%- set pve = proxmox_address | default('', true) | string | trim -%}
  {%- if pve -%}
  {%-   set _ = out.append({'key': pve, 'value': 'the Proxmox host'}) -%}
  {%- endif -%}
  {%- set nodes = kubernetes_node_addresses | default({}, true) -%}
  {%- for node in (nodes | dict2items if nodes is mapping else []) if node.value | default('', true) | string | trim -%}
  {%-   set _ = out.append({'key': node.value | string | trim, 'value': node.key}) -%}
  {%- endfor -%}
  {{ out | items2dict }}
# The admin pages the report lists: the Proxmox host's, the NAS's, and the cluster's two APIs, on the control plane.
# The Proxmox host's own page is its Tailscale node's too, which the report also gives at the host's tailnet name.
status_admin: >-
  {%- set out = [] -%}
  {%- if proxmox_address | default('', true) -%}
  {%-   set _ = out.append({'name': 'Proxmox VE', 'url': 'https://' ~ proxmox_address | trim ~ ':8006',
                            'tailscale_node': true}) -%}
  {%- endif -%}
  {%- if nas_present and nas_address -%}
  {%-   set _ = out.append({'name': 'TrueNAS', 'url': 'https://' ~ nas_address}) -%}
  {%- endif -%}
  {%- if kubernetes_present -%}
  {%-   set cp = kubernetes_node_addresses[(kubernetes_nodes | selectattr('role', 'equalto', 'controlplane')
                                            | first).name] | trim -%}
  {%-   set _ = out.append({'name': 'Kubernetes API', 'url': 'https://' ~ cp ~ ':6443'}) -%}
  {%-   set _ = out.append({'name': 'Talos API', 'url': cp ~ ':50000'}) -%}
  {%- endif -%}
  {{ out }}
# What the report suggests for each kind of thing to do; {names} is the apps just suspend stopped.
status_commands:
  upgrade: just deploy proxmox
  pveproxy: >-
    systemctl status pveproxy on the Proxmox host, which serves its API and web UI (and /etc/default/pveproxy, should it
    listen elsewhere)
  proxmox_token: >-
    the project's Proxmox API token, made on the host (scripts/runbooks/proxmox-token.md), its secret in the vault as
    vault_proxmox_token_secret (just vault)
  reboot: reboot it at a quiet time
  resume: just resume --only {names}
  talos_upgrade: just talos-upgrade --check, then just talos-upgrade
  credentials: just deploy kubernetes, which renews them
  allowlist: >-
    the first visits (scripts/runbooks/first-run.md), then kubernetes_ingress_allowed_range in local.yml and just
    deploy kubernetes
  secrets: k8s/README-secrets.md says how to make it
  nas: just deploy truenas
  nas_release: >-
    just deploy truenas refuses it until truenas_supported_version (roles/truenas) is raised, once TrueNAS's API
    changes are checked
  nas_network: commit or roll them back on the NAS's Network page; just deploy truenas refuses to run until then
  nas_clock: >-
    the NAS's NTP servers, in System, General Settings on the NAS, which truenas_ntp_servers
    (group_vars/nas/truenas.yml) sets with just deploy truenas
  nas_disk_heat: >-
    the NAS's fans and airflow, and what the disk is busy with (a scrub or a resilver heats it); TrueNAS raises its own
    critical alert at the disk's critical temperature
  nas_disk_errors: >-
    each disk's SMART results on the NAS's Storage page, and its cable or slot; ZFS keeps the counts until the NAS
    reboots, TrueNAS 25.10 having no API call that clears them (roles/status/README.md)
  nas_clients: >-
    who holds the address, from the router's DHCP leases; just deploy truenas puts every share's hosts back as
    group_vars/nas/truenas.yml has them
  time_machine: on the Mac, Time Machine's settings and its last backup's error (scripts/runbooks/timemachine.md)
  time_machine_quota: >-
    a larger quota_gib in local.yml and just deploy truenas, or fewer weeks of weekly snapshots
    (scripts/runbooks/timemachine.md)
  backup: just deploy proxmox
  backup_target: >-
    vm_backup_storage in local.yml names where they go (a USB disk, or a Proxmox Backup Server), then just deploy
    proxmox
  etcd_snapshot: just etcd-snapshot
  tailscale: just deploy proxmox
  tailscale_login: >-
    a one-off auth key in the vault (just vault; scripts/runbooks/tailscale.md, section 4), then just deploy
    proxmox
  split_dns: Tailscale's admin console, DNS (scripts/runbooks/tailscale.md, section 2)
