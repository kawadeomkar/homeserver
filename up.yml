---
# Brings back what make down stopped, every app or those ONLY names, handing each back to Flux, and starts Home
# Assistant's VM:
#   make check-up
#   make up ONLY=jellyfin,homeassistant
# ALL=1 starts the cluster's VMs first, the control plane before the worker, and the apps wait for every node.
# Without a cluster, or without Home Assistant, its play ends by itself.
# An inventory made before the cluster has no kubernetes group, and the apps' play would match no host and end
# without a word: refused here instead, as kubernetes.yml refuses it.
- name: Refuse a cluster without the kubernetes inventory group
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse a cluster without the kubernetes inventory group
      ansible.builtin.assert:
        that: not kubernetes_present or (groups['kubernetes'] | default([]) | length == 1)
        fail_msg: >-
          The inventory needs the kubernetes group with its one host: add [kubernetes] and homeserver-k8s to
          inventory, as in inventory.example.
        quiet: true
      tags: [always]

- name: Start the cluster's VMs
  hosts: proxmox
  gather_facts: false
  vars:
    # make's ONLY, comma-separated names, passed as -e '{"only": "<names>"}', and its ALL, as {"cluster_vms": true}.
    only_names: "{{ (only | default('')).split(',') | map('trim') | select | list }}"
  pre_tasks:
    - name: Refuse ALL with ONLY
      ansible.builtin.assert:
        that: not (cluster_vms | default(false) | bool) or only_names | length == 0
        fail_msg: ALL=1 starts everything, the cluster's VMs first, so it takes no ONLY.
        quiet: true
      tags: [always]
    - name: Leave the cluster's VMs alone without ALL=1
      ansible.builtin.meta: end_host
      when: not (cluster_vms | default(false) | bool)
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Skip them when local.yml names no nodes
      ansible.builtin.meta: end_host
      when: not kubernetes_present
      tags: [always]
  tasks:
    - name: Start the cluster's VMs, the control plane first
      ansible.builtin.import_role:
        name: proxmox_vm
        tasks_from: power
      vars:
        proxmox_vm_power: running
        proxmox_vm_power_vmids: "{{ kubernetes_power_order | reverse | list }}"

- name: Bring the apps back up
  hosts: kubernetes
  gather_facts: false
  vars:
    # make's ONLY, comma-separated names, passed as -e '{"only": "<names>"}'.
    only_names: "{{ (only | default('')).split(',') | map('trim') | select | list }}"
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Say why the cluster is skipped
      ansible.builtin.debug:
        msg: No kubernetes_node_addresses in group_vars/all/local.yml, so this setup has no cluster.
      when: not kubernetes_present
      tags: [always]
    - name: Skip the cluster when local.yml names no nodes
      ansible.builtin.meta: end_host
      when: not kubernetes_present
      tags: [always]
    # With ALL=1 the VMs were only just started: the apps wait until every node is Ready. A dry run asks once.
    - name: Wait for the cluster's nodes
      ansible.builtin.command:
        argv: [kubectl, --kubeconfig, "{{ app_scale_kubeconfig }}", wait, --for=condition=Ready, nodes, --all, --timeout=20s]
      register: up_nodes
      changed_when: false
      check_mode: false
      failed_when: false
      until: up_nodes.rc == 0
      retries: "{{ 0 if ansible_check_mode else 45 }}"
      delay: 10
      when: cluster_vms | default(false) | bool
    - name: Refuse to go on without the cluster
      ansible.builtin.assert:
        that: up_nodes.rc == 0
        fail_msg: "The cluster's nodes were not all Ready within ten minutes: {{ up_nodes.stderr | default('') | trim }}"
        quiet: true
      when: (cluster_vms | default(false) | bool) and not ansible_check_mode
    - name: Say the apps come back once the cluster is up
      ansible.builtin.debug:
        msg: The cluster is not up yet; a real run starts its VMs, waits for every node, then brings the apps back.
      when: (cluster_vms | default(false) | bool) and ansible_check_mode and up_nodes.rc != 0
    - name: Leave the apps for the real run
      ansible.builtin.meta: end_host
      when: (cluster_vms | default(false) | bool) and ansible_check_mode and up_nodes.rc != 0
    # So that make down ONLY=homeassistant needs no answer from the cluster.
    - name: Leave the apps alone when ONLY names Home Assistant alone
      ansible.builtin.meta: end_host
      when: only_names == ['homeassistant'] and haos_present
      tags: [always]
  roles:
    - role: app_scale
      vars:
        app_scale_state: up
        # Accepted in ONLY besides the apps and groups: Home Assistant, which the next play takes.
        app_scale_other_names: "{{ ['homeassistant'] if haos_present else [] }}"
        # What local.yml's kubernetes_apps leaves out, which a refused name is said to be.
        app_scale_disabled_names: "{{ kubernetes_apps_disabled_names }}"
        app_scale_only: "{{ only_names }}"

# A play of its own on the Proxmox host. The apps' play, whose failure ends the run before this one, has refused any
# name it does not know; without a cluster, this play does. The shutdown is the guest's own, never a forced stop.
- name: Start Home Assistant's VM
  hosts: proxmox
  gather_facts: false
  vars:
    # make's ONLY, as in the apps' play.
    only_names: "{{ (only | default('')).split(',') | map('trim') | select | list }}"
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Home Assistant section
      ansible.builtin.assert:
        that: haos_settings_error | length == 0
        fail_msg: "{{ haos_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Refuse a name this setup does not have
      ansible.builtin.assert:
        that: kubernetes_present or _unknown | length == 0
        fail_msg: >-
          This setup has no cluster, so make up knows no {{ _unknown | join(', ') }}{{
          ': only homeassistant' if haos_present else ', nor any other name: it has no Home Assistant either' }}.
        quiet: true
      tags: [always]
      vars:
        _unknown: "{{ only_names | difference(['homeassistant'] if haos_present else []) }}"
    - name: Say why Home Assistant is skipped
      ansible.builtin.debug:
        msg: No haos_mac in group_vars/all/local.yml, so this setup has no Home Assistant VM.
      when: not haos_present
      tags: [always]
    - name: Skip Home Assistant when local.yml names no MAC for it
      ansible.builtin.meta: end_host
      when: not haos_present
      tags: [always]
    - name: Leave Home Assistant alone when ONLY names others
      ansible.builtin.meta: end_host
      when: only_names | length > 0 and 'homeassistant' not in only_names
      tags: [always]
  tasks:
    - name: Start Home Assistant's VM
      ansible.builtin.import_role:
        name: proxmox_vm
        tasks_from: power
      vars:
        proxmox_vm_power: running
        proxmox_vm_power_vmids: ["{{ haos_vm_vmid | int }}"]
