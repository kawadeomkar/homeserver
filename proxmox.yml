---
# Configure the Proxmox host, over root SSH: its package repositories and upgrades first, then, when
# group_vars/all/local.yml sets tailscale_enabled or lists tailscale_advertise_routes, Tailscale, which joins it to
# the tailnet for remote access and with routes makes it the LAN's subnet router, then its VM-disk storage, then the
# nightly backup of its VMs, and last, when there is a cluster, the node exporter its Prometheus scrapes. Tailscale
# comes before the storage, so remote access never waits on a storage the run refuses. With a NAS, its NFS shares are
# added as storage: run truenas.yml first, so the shares exist and are exported to this host. Without one (no NAS
# address in group_vars/all/local.yml), the installer's own storage is checked to hold VM disks, as it is with a NAS
# when there is a cluster, whose EFI disks go there. A TrueNAS section that keeps other settings but gives no
# address stops the play, as in truenas.yml, and so does an incomplete Kubernetes or Home Assistant section, since
# the backup covers the cluster's VMs and Home Assistant's.
- name: Configure the Proxmox host's packages and VM storage
  hosts: proxmox
  gather_facts: false
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    # The nightly backup covers the Home Assistant VM, so its section is read here too.
    - name: Refuse an incomplete Home Assistant section
      ansible.builtin.assert:
        that: haos_settings_error | length == 0
        fail_msg: "{{ haos_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
  roles:
    - role: proxmox_apt
    - role: proxmox_tailscale
    - role: proxmox_storage
    - role: proxmox_backup
    - role: proxmox_node_exporter
  post_tasks:
    - name: Say which VMs have no backup
      ansible.builtin.debug:
        msg: >-
          No backup job: VMs {{ vm_backup_vmids | join(', ') }} are not backed up, because this setup has no NAS and
          group_vars/all/local.yml names no vm_backup_storage. Add a storage that holds backups (a USB disk set
          up as a checked mount point, or a Proxmox Backup Server) and name it there.
      when: vm_backup_vmids | length > 0 and not vm_backup_target
      tags: [always]
    # Left to do (NEXT STEPS), in just status's words.
    - name: Record the VMs that have no backup
      ansible.builtin.set_stats:
        data:
          homeserver_next:
            backup:
              target:
                text: "nothing is backed up: no backup job covers VMs {{ vm_backup_vmids | join(', ') }}"
                command: "{{ status_commands.backup_target }}"
      when: vm_backup_vmids | length > 0 and not vm_backup_target
      tags: [always]
