---
# Configure the NAS through its API. Check first:
#   make check-truenas            (or: .venv/bin/ansible-playbook truenas.yml --check --diff)
# One stage at a time: add --tags truenas_network, truenas_pools, truenas_system,
# truenas_datasets, truenas_nfs or truenas_services.
# Without a NAS (no truenas_static_address or truenas_bootstrap_address in group_vars/all/local.yml)
# the play says so and ends before the role runs.
- name: Configure the TrueNAS storage server
  hosts: nas
  gather_facts: false
  pre_tasks:
    - name: Say why the NAS is skipped
      ansible.builtin.debug:
        msg: >-
          Neither truenas_static_address nor truenas_bootstrap_address is set in group_vars/all/local.yml,
          so this setup is treated as having no NAS. Proxmox keeps its VM disks on its own storage.
      when: not nas_present
      tags: [always]
    - name: Skip the NAS when local.yml gives it no address
      ansible.builtin.meta: end_host
      when: not nas_present
      tags: [always]
  roles:
    - role: truenas
