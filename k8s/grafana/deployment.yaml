---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      name: grafana
      labels:
        app: grafana
    spec:
      securityContext:
        # grafana/grafana ships as uid 472; fsGroup lets it write the hostPath PV
        # without running as root. The values below were already here, commented out.
        fsGroup: 472
        runAsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            # NOTE: PUID/PGID were removed — those are a LinuxServer.io convention and
            # grafana/grafana is not an lsio image, so they were never read.
            - name: TZ
              value: America/Los_Angeles
          ports:
            - name: grafana
              containerPort: 3000
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: 500M
              cpu: "500m"
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - mountPath: /var/lib/grafana
              name: grafana-storage
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasources
              readOnly: false
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-ini
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-opt-claim
        - name: grafana-datasources
          configMap:
            defaultMode: 420
            name: grafana-datasources
