---
# The cluster's ingress, the default IngressClass, on one LoadBalancer address (LB_TRAEFIK_IP, from the cluster's
# settings), answering only the clients local.yml allows (INGRESS_ALLOWED_RANGE). Plain HTTP for now: TLS comes with a
# real domain. Gateway API later, with its CRDs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: traefik
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: false
    service:
      annotations:
        metallb.io/loadBalancerIPs: "${LB_TRAEFIK_IP}"
      spec:
        type: LoadBalancer
        # Keeps clients' addresses; MetalLB announces from the node the pod runs on.
        externalTrafficPolicy: Local
        allocateLoadBalancerNodePorts: false
    ports:
      websecure:
        expose:
          default: false
      web:
        http:
          # Every route on this entrypoint answers only the allowed range (k8s/infrastructure/configs/traefik.yaml).
          # Until infra-configs applies that Middleware, Traefik refuses the routes that name it: closed, not open.
          middlewares:
            - traefik-lan-allowlist@kubernetescrd
        transport:
          respondingTimeouts:
            # Large uploads (Nextcloud, PhotoPrism, FileBrowser) take longer than the 60-second default.
            readTimeout: 0
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
