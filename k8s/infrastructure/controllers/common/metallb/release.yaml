---
# Layer 2 only: the speaker answers ARP for the addresses of infrastructure/configs' pool. The chart's default BGP
# backend, frr-k8s, is off. The chart sets no requests, and a pod without any is the first evicted under memory
# pressure, taking the LoadBalancer addresses with it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: 0.16.1
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    frrk8s:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    speaker:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
