---
# MetalLB's chart as an OCI artifact, the same release its Helm repository serves, so it can be pinned by digest. The
# digest is what is pulled (the tag says which release it is): a tag moved upstream changes nothing here, and
# just lint charts fails until both are bumped together.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 12h
  url: oci://quay.io/metallb/chart/metallb
  ref:
    tag: 0.16.1
    digest: sha256:814c5ef92f9354238eabe52d6313a64a0ccfe52e9b941b0319202960e36e483e
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
