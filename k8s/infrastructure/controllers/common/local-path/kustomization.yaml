---
# local-path-provisioner, as vendored in local-path-storage.yaml, changed by the patches below rather than by edits
# to that file (README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
# The provisioner's image, pinned by digest at the vendored release's tag.
images:
  - name: docker.io/rancher/local-path-provisioner
    newTag: v0.0.37
    digest: sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
patches:
  # The default StorageClass, named local. Its volumes are `local` PersistentVolumes, not hostPath ones (the
  # annotation), and are kept when their claim goes: an app's data is never deleted with its claim.
  - target:
      kind: StorageClass
      name: local-path
    patch: |
      - op: replace
        path: /metadata/name
        value: local
      - op: replace
        path: /reclaimPolicy
        value: Retain
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
          defaultVolumeType: local
  # Requests, and a security context, which upstream sets none of.
  - target:
      kind: Deployment
      name: local-path-provisioner
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
  # The volumes live on Talos's user volume local-path-provisioner, on each node's data disk, and the helper pod's
  # image is pinned by digest (upstream's is busybox, untagged).
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |
      - op: replace
        path: /data/config.json
        value: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":["/var/mnt/local-path-provisioner"]
                  }
                  ]
          }
      - op: replace
        path: /data/helperPod.yaml
        value: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
