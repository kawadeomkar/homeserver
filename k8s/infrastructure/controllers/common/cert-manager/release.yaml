---
# cert-manager issues the apps' certificate: a wildcard for *.${DOMAIN}, signed by the cluster's own CA
# (k8s/infrastructure/configs/tls.yaml), renewed before it expires. Its CRDs come with the chart and stay when the
# release goes (crds.keep), so the certificates do too. The chart's post-install API check is a Helm hook Job, left
# out: Flux waits for the release to be ready instead. Every component requests CPU and memory (make lint-helm).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    startupapicheck:
      enabled: false
