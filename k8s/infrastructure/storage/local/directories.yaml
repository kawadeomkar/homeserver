---
# A local PersistentVolume does not make its directory, so this Job makes each one, owned by 1000 like the apps that
# use them; mkdir -p makes it a no-op once they exist. It is the one hostPath in the repository's manifests: the
# node's /var/mnt, where Talos mounts the data and media volumes. It first checks that each directory's volume
# (/var/mnt/<volume>) is mounted, another device than /var/mnt itself, and fails otherwise: with a user volume whose
# disk selector matched nothing, the directories would land on the system disk, which a reinstall wipes. A Job's pod template cannot change, so Flux
# replaces it (force) when a directory is added, instead of failing infra-storage, which every app waits for. No TTL:
# Flux would recreate a Job deleted after it finished on every reconcile.
apiVersion: batch/v1
kind: Job
metadata:
  name: static-volume-directories
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: static-volume-directories
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    ignore-check.kube-linter.io/no-liveness-probe: "A run-once Job serves nothing to probe."
    ignore-check.kube-linter.io/no-readiness-probe: "A run-once Job serves nothing to probe."
    ignore-check.kube-linter.io/job-ttl-seconds-after-finished: "With a TTL Flux would recreate it after every run."
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static-volume-directories
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: "${DATA_NODE}"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mkdir
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - sh
            - -c
            - |
              for d in "$@"; do
                v=/var/mnt/$(echo "$d" | cut -d/ -f4)
                if [ ! -d "$v" ] || [ "$(stat -c %d "$v")" = "$(stat -c %d /var/mnt)" ]; then
                  echo "$v is not mounted: its Talos user volume is missing" >&2
                  exit 1
                fi
                mkdir -p "$d" && chown 1000:1000 "$d" || exit 1
              done
            - mkdir
          args:
            - "${MEDIA_LOCAL_PATH}"
            - "${FRIGATE_LOCAL_PATH}"
            - /var/mnt/local-path-provisioner/static/nextcloud-data
            - /var/mnt/local-path-provisioner/static/photoprism-media
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: var-mnt
              mountPath: /var/mnt
      volumes:
        - name: var-mnt
          hostPath:
            path: /var/mnt
            type: Directory
