---
# The NAS datasets the apps mount, as static volumes through csi-driver-nfs, each bound to one claim. Retained when
# the claim goes, and never pruned: the data outlives the cluster. A PersistentVolume's csi section cannot change, so
# a new NAS address means deleting and recreating the volume, never the data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.2]
  claimRef:
    namespace: media
    name: media
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "${NAS_ADDRESS}#${MEDIA_DATASET}##"
    volumeAttributes:
      server: "${NAS_ADDRESS}"
      share: "${MEDIA_DATASET}"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
