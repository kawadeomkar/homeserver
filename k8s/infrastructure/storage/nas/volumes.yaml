  mountOptions: [nfsvers=4.2]
  claimRef:
    namespace: nextcloud
    name: nextcloud-data
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: "${NAS_ADDRESS}#/mnt/${NAS_POOL_PERSISTENT}/nextcloud##"
    volumeAttributes:
      server: "${NAS_ADDRESS}"
      share: "/mnt/${NAS_POOL_PERSISTENT}/nextcloud"
