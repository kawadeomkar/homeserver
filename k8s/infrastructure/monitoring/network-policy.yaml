---
# Prometheus, Alertmanager and kube-state-metrics answer only this namespace (Prometheus and Grafana); Grafana also
# Traefik, its ingress. None of them authenticates, so without this any pod could read every metric or silence an
# alert. The operator and its admission webhook, which the API server calls from a node, and node-exporter, on the
# host network, are left out. Enforced by kube-network-policies (group_vars/kubernetes/talos.yml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [prometheus, alertmanager, kube-state-metrics]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
