---
# Who may reach the apps through Traefik: one range of client addresses, on every router of the web entrypoint
# (the HelmRelease's ports.web.http.middlewares). It is local.yml's kubernetes_ingress_allowed_range, through the
# cluster's settings; without it, the loopback address, which no client has, so a new cluster answers the LAN with 403
# until each app's first-run setup is done through kubectl port-forward: several
# make their first visitor the admin. Traefik's Service keeps clients' addresses (externalTrafficPolicy: Local), so
# the range is matched against the client's own address, never a node's.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-allowlist
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - "${INGRESS_ALLOWED_RANGE}"
---
# Browsers that once reached an app over HTTPS refuse it over plain HTTP for a year, so a stripped redirect cannot
# downgrade them. On every route of the websecure entrypoint (the HelmRelease's ports.websecure.http.middlewares).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
