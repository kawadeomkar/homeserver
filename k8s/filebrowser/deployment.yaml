---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: filebrowser
  labels:
    app: filebrowser
  name: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:v2.63.18
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /srv
              name: filebrowser
            - mountPath: /database/filebrowser.db
              name: filebrowser-db
      restartPolicy: Always
      volumes:
        # Was `path: /` — the entire node filesystem, writable, served over an
        # unauthenticated Ingress. Scoped to the media tree, which is what this
        # service exists to browse. /opt/media/data is the same single mount
        # sonarr/radarr/sabnzbd share, so hardlinks stay intact.
        - hostPath:
            path: /opt/media/data
            type: Directory
          name: filebrowser
        # `type:` was absent, so containerd would create filebrowser.db as a
        # DIRECTORY and the container could not open its database (part of K8S-4).
        - hostPath:
            path: /opt/filebrowser/filebrowser.db
            type: FileOrCreate
          name: filebrowser-db
