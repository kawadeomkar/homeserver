---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-deployment
  namespace: homeassistant
  labels:
    app: homeassistant
  annotations:
    ignore-check.kube-linter.io/drop-net-raw-capability: "Added for device discovery, which also needs hostNetwork (CLAUDE.md); the namespace is labelled privileged."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - image: ghcr.io/home-assistant/home-assistant:2026.7.4
          name: homeassistant
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BROADCAST
          volumeMounts:
            - mountPath: /config
              name: homeassistant-opt-volume
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: homeassistant-opt-volume
          persistentVolumeClaim:
            claimName: homeassistant-opt-claim
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
