---
# This file previously held a byte-identical copy of deployment.yaml, so the
# ClusterRoleBinding it is named for did not exist anywhere: the ServiceAccount
# was never bound to the ClusterRole in cluster-role.yaml, and kube-state-metrics
# would have crash-looped on `forbidden` for every list/watch it makes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
