---
# Homepage (Flux Kustomization apps-homepage).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - homepage.yaml
# Homepage's configuration, copied into its emptyDir at every start (homepage.yaml). Generated, so its name carries a
# hash of its content and a change rolls the pods; a plain ConfigMap would be read only at their next start. Each
# tile links to its app's ingress and checks its Service from inside the cluster. Flux fills in ${DOMAIN} and the
# optional ${HAOS_URL}. The empty files are ones Homepage would otherwise write a skeleton of into the emptyDir.
configMapGenerator:
  - name: homepage
    namespace: homepage
    files:
      - kubernetes.yaml=config/kubernetes.yaml.tmpl
      - settings.yaml=config/settings.yaml.tmpl
      - bookmarks.yaml=config/bookmarks.yaml.tmpl
      - widgets.yaml=config/widgets.yaml.tmpl
      - services.yaml=config/services.yaml.tmpl
    literals:
      - custom.css=
      - custom.js=
      - docker.yaml=
    options:
      labels:
        app.kubernetes.io/name: homepage
