---
# Who may reach Homepage, and what it may reach. Talos's Flannel enforces it with kube-network-policies
# (group_vars/kubernetes/talos.yml); each app namespace has one such policy (tests/policy/test_k8s.py).
# In: Traefik (the ingress); nothing else in the cluster.
# Out: anywhere but EGRESS_DENIED_ADDRESS, the NAS, whose NFS exports trust the node's address, which a pod's traffic
# leaves the node with (the Proxmox host without a NAS). Every pod in the cluster stays reachable, DNS included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - "${EGRESS_DENIED_ADDRESS}/32"
