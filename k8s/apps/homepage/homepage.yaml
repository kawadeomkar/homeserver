---
# Homepage, the start page at the domain's apex. The one app with two replicas, rolled one at a time and spread
# across nodes when there are two, since it holds nothing. Homepage writes into /app/config (its logs, and a skeleton
# file for any its configuration lacks) and exits when it cannot, so /app/config is an emptyDir the ConfigMap is
# copied into at each start: a release that adds a skeleton file then starts too. Its services.yaml is joined there
# from the tiles of the apps this host runs, in the order HOMEPAGE_SERVICES gives (kustomization.yaml). The
# ConfigMaps are generated, so a change to their files rolls the pods. Kustomize takes their hash before Flux fills
# in the settings, so the pod template carries those too: the domain in HOMEPAGE_ALLOWED_HOSTS, the tiles in
# HOMEPAGE_SERVICES, Home Assistant's address in an annotation, and a change to any of them rolls the pods as well.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
      annotations:
        homeserver.internal/haos-url: "${HAOS_URL:=}"
    spec:
      # Named, not left out: a Deployment that once named another account keeps its deprecated serviceAccount field,
      # which would bring that name back.
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: homepage
          matchLabelKeys: [pod-template-hash]
      # kube-linter's no-anti-affinity check reads affinity, not spread constraints.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: homepage
      initContainers:
        - name: copy-config
          image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          # A fragment that is missing fails the start; no tile at all is an empty list, which Homepage reads.
          command:
            - sh
            - -c
            - |
              set -e
              cp /seed/* /app/config/
              : > /app/config/services.yaml
              for f in $HOMEPAGE_SERVICES; do cat "/tiles/$f.yaml" >> /app/config/services.yaml; done
              [ -s /app/config/services.yaml ] || echo '[]' > /app/config/services.yaml
          env:
            - name: HOMEPAGE_SERVICES
              value: "${HOMEPAGE_SERVICES}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: seed
              mountPath: /seed
            - name: tiles
              mountPath: /tiles
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The hosts it answers: its own address (the probes) and the domain. $(MY_POD_IP) is Kubernetes's own
            # expansion, which Flux leaves alone.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000,${DOMAIN}"
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: seed
          configMap:
            name: homepage
        - name: tiles
          configMap:
            name: homepage-tiles
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  ingressClassName: traefik
  rules:
    - host: "${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
