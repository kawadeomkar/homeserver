---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # LinuxServer.io: starts as root, and s6 drops to PUID and PGID; it needs the default capabilities, but not
        # NET_RAW, whose raw sockets nothing here opens and which would let it forge its neighbours' packets.
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls155
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "${TZ}"
            # A login from every address, never "disabled for local addresses": behind Traefik each request comes
            # from a pod's address, which counts as local, so that choice would open the app to the whole LAN. Set
            # here, it holds whatever the app's own settings say (scripts/runbooks/first-run.md).
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 9696
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          # A slow first start (database migrations, before it listens) gets five minutes before liveness counts.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  name: http
