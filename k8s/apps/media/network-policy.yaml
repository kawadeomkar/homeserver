---
# Who may reach the media apps, and what they may reach. Talos's Flannel enforces it with kube-network-policies
# (group_vars/kubernetes/talos.yml); each app namespace has one such policy (tests/policy/test_k8s.py).
# In: one another (Seerr, Prowlarr and the download client talk to each other), Traefik (every app's
# ingress) and Homepage (its tiles' checks); nothing else in the cluster.
# Out: anywhere but EGRESS_DENIED_ADDRESS, the NAS, whose NFS exports trust the node's address, which a pod's traffic
# leaves the node with (the Proxmox host without a NAS). Every pod in the cluster stays reachable, DNS included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media
  namespace: media
  labels:
    app.kubernetes.io/name: media
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
  egress:
    - to:
        - namespaceSelector: {}
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - "${EGRESS_DENIED_ADDRESS}/32"
