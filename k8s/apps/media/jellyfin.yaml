---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 20Gi
---
# Jellyfin streams the library from /data. Its configuration and metadata are on a local volume, never NFS (its
# SQLite database). Transcoding writes to /transcode, an emptyDir on the node's system disk, so transcodes never land
# on the backed-up, snapshotted data disk: set Dashboard -> Playback -> Transcoding's path to /transcode after the
# first start. Hardware transcoding with the iGPU when the host passes one through (Dashboard -> Playback ->
# Transcoding: Intel QuickSync), software otherwise. No DLNA or discovery ports: clients reach it through the ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The library's mount point belongs to root on a new dataset; the app runs as 1000. Only the mount point,
        # never recursively, so it is quick on a full library and a no-op once done.
        - name: chown-mount
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: [sh, -c, 'd=/mnt/v; [ "$(stat -c %u:%g "$d")" = 1000:1000 ] || chown 1000:1000 "$d"']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: media
              mountPath: /mnt/v
      containers:
        # LinuxServer.io: starts as root, and s6 drops to PUID and PGID; it needs the default capabilities.
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls42
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "${TZ}"
            - name: JELLYFIN_PublishedServerUrl
              value: "http://jellyfin.${DOMAIN}"
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              # The iGPU when the host passes one through (GPU_I915 1), none otherwise: a limit of 0 asks for no
              # device, so the pod schedules on a node without the plugin.
              gpu.intel.com/i915: "${GPU_I915}"
              memory: 4Gi
          # A first start, or an upgrade, migrates the database before it listens: up to ten minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: transcode
              mountPath: /transcode
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: transcode
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
