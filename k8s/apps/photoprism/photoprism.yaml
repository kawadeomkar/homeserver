---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage
  namespace: photoprism
  labels:
    app.kubernetes.io/name: photoprism
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 20Gi
---
# The originals and the imports, in one dataset mounted once: the static PersistentVolume photoprism-media, on the
# NAS's persistent/photoprism with a NAS and on the node's data volume without one. One mount, so an import moves a
# photo into the originals by a rename, never a copy over NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-media
  namespace: photoprism
  labels:
    app.kubernetes.io/name: photoprism
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: photoprism-media
  resources:
    requests:
      storage: 1Ti
---
# PhotoPrism starts as root, as its s6-overlay init needs (run as 1000 it exits at once: /run belongs to root), with
# the default capabilities but NET_RAW, as the LinuxServer.io images keep theirs. Its entrypoint makes an account for
# PHOTOPRISM_UID and runs PhotoPrism as 1000:1000 through setpriv. PHOTOPRISM_DISABLE_CHOWN stops that entrypoint
# chowning the whole storage volume, thumbnails included, at every start: local-path makes the volume's directory
# world-writable, so 1000 needs no chown there. It makes originals/ and import/ itself, in the mount point chown-mount
# gives it. Its first start indexes and migrates before it listens, hence ten minutes of startup probe. The database
# password and the admin's come from the SOPS Secret photoprism.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: photoprism
  labels:
    app.kubernetes.io/name: photoprism
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: photoprism
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photoprism
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The dataset's mount point belongs to root when new; the app runs as 1000. Only the mount point, never
        # recursively, so it is quick on a full volume and a no-op once done.
        - name: chown-mount
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: [sh, -c, 'd=/mnt/v; [ "$(stat -c %u:%g "$d")" = 1000:1000 ] || chown 1000:1000 "$d"']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: media
              mountPath: /mnt/v
      containers:
        - name: photoprism
          image: docker.io/photoprism/photoprism:260601@sha256:650c6ad5a6517ea95671eedb0f2a9c49f05729a1d95809fcf01533b96149582e
          env:
            - name: PHOTOPRISM_UID
              value: "1000"
            - name: PHOTOPRISM_GID
              value: "1000"
            - name: PHOTOPRISM_DISABLE_CHOWN
              value: "true"
            - name: PHOTOPRISM_SITE_URL
              value: "https://photoprism.${DOMAIN}/"
            - name: PHOTOPRISM_HTTP_PORT
              value: "2342"
            - name: PHOTOPRISM_ORIGINALS_PATH
              value: /photoprism/media/originals
            - name: PHOTOPRISM_IMPORT_PATH
              value: /photoprism/media/import
            - name: PHOTOPRISM_STORAGE_PATH
              value: /photoprism/storage
            - name: PHOTOPRISM_DATABASE_DRIVER
              value: mysql
            - name: PHOTOPRISM_DATABASE_SERVER
              value: photoprism-db:3306
            - name: PHOTOPRISM_DATABASE_NAME
              value: photoprism
            - name: PHOTOPRISM_DATABASE_USER
              value: photoprism
            - name: TZ
              value: "${TZ}"
          envFrom:
            - secretRef:
                name: photoprism
          ports:
            - name: http
              containerPort: 2342
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
          volumeMounts:
            - name: media
              mountPath: /photoprism/media
            - name: storage
              mountPath: /photoprism/storage
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: photoprism-media
        - name: storage
          persistentVolumeClaim:
            claimName: photoprism-storage
---
apiVersion: v1
kind: Service
metadata:
  name: photoprism
  namespace: photoprism
  labels:
    app.kubernetes.io/name: photoprism
spec:
  selector:
    app.kubernetes.io/name: photoprism
  ports:
    - name: http
      port: 2342
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photoprism
  namespace: photoprism
  labels:
    app.kubernetes.io/name: photoprism
spec:
  ingressClassName: traefik
  rules:
    - host: photoprism.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photoprism
                port:
                  name: http
