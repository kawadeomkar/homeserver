---
# Nextcloud and its database (Flux Kustomization apps-nextcloud). The Secret nextcloud/nextcloud-db is a SOPS file
# (k8s/README-secrets.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - nextcloud-db.sops.yaml
  - nextcloud.yaml
  - database.yaml
