---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config
  namespace: nextcloud
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 5Gi
---
# The users' files: the static PersistentVolume nextcloud-data, on the NAS's persistent/nextcloud with a NAS and on
# the node's data volume without one (k8s/infrastructure/storage/).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 1Ti
---
# Nextcloud (LinuxServer.io), on port 80 behind Traefik. Its first start and every upgrade run occ upgrade before
# nginx listens; a liveness probe that killed it then would leave it in maintenance mode with a half-migrated
# database, hence ten minutes of startup probe. The admin account is made in the web setup wizard, against the
# database nextcloud-db (README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The dataset's mount point belongs to root when new; the app runs as 1000. Only the mount point, never
        # recursively, so it is quick on a full volume and a no-op once done.
        - name: chown-mount
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command: [sh, -c, 'd=/mnt/v; [ "$(stat -c %u:%g "$d")" = 1000:1000 ] || chown 1000:1000 "$d"']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /mnt/v
      containers:
        # LinuxServer.io: starts as root, and s6 drops to PUID and PGID; it needs the default capabilities, but not
        # NET_RAW, whose raw sockets nothing here opens and which would let it forge its neighbours' packets.
        - name: nextcloud
          image: docker.io/linuxserver/nextcloud:34.0.2-ls444@sha256:ddd8115a43a94147780a8413009b18d418869f24d37c436e47471335399a4c7d
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "${TZ}"
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          # Once installed, Nextcloud answers status.php with 400 for a host it does not trust, and it trusts localhost
          # always: the setup wizard, done through a port forward, trusts only that until README step 3 adds the
          # domain, and a probe naming the domain would have the pod killed in between.
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nextcloud-config
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  selector:
    app.kubernetes.io/name: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
spec:
  ingressClassName: traefik
  rules:
    - host: nextcloud.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud
                port:
                  name: http
