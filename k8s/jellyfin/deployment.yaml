---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
  namespace: jellyfin
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      #securityContext:
      #runAsUser: 1000
      #  runAsGroup: 1000
          #supplementalGroups:
          #- 110 # getent group render | cut -d: -f3
      volumes:
        - name: fs-jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-pvc-config
        - name: fs-jellyfin-data
          persistentVolumeClaim:
            claimName: jellyfin-pvc-data
        - name: dev-dri-render
          hostPath:
            path: "/dev/dri/renderD128"
      containers:
        - env:
            - name: JELLYFIN_PublishedServerUrl
              value: 192.168.1.5
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
          securityContext:
            privileged: true
          image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls42
          name: jellyfin
          ports:
            - containerPort: 8096
              name: http-tcp
              protocol: TCP
            - containerPort: 8920
              name: https-tcp
              protocol: TCP
            - containerPort: 1900
              name: dlna-udp
              protocol: UDP
            - containerPort: 7359
              name: discovery-udp
              protocol: UDP
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - mountPath: /config
              name: fs-jellyfin-config
            - mountPath: /data
              name: fs-jellyfin-data
            - mountPath: /dev/dri/renderD128
              name: dev-dri-render
      dnsPolicy: ClusterFirst
      restartPolicy: Always
