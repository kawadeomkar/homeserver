---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-ingress
  namespace: nextcloud
  # Nextcloud needs a large request-body ceiling for uploads. This used to be
  # `nginx.ingress.kubernetes.io/proxy-body-size: 10240m` (10 GB), inert under
  # Traefik and removed with the other nginx annotations. Traefik imposes no
  # default limit, so nothing is needed today — but if ingress-nginx is ever
  # chosen, its 1 MiB default MUST be raised back to 10 GB or uploads break.
spec:
  rules:
    - host: nextcloud.homeserver.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextcloud-service
                port:
                  number: 80
