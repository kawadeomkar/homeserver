---
# Everything, in dependency order: the NAS, then the Proxmox host, then Home Assistant's VM and the Kubernetes
# cluster, which do not depend on each other. Without a NAS the first play ends by itself, without haos_mac the
# third, and without a cluster the last does nothing.
- name: Configure the NAS
  ansible.builtin.import_playbook: truenas.yml

- name: Configure the Proxmox host
  ansible.builtin.import_playbook: proxmox.yml

- name: Create Home Assistant's VM
  ansible.builtin.import_playbook: homeassistant.yml

- name: Build the Kubernetes cluster
  ansible.builtin.import_playbook: kubernetes.yml
