---
# kube-linter's configuration (make lint-kube-linter): its default checks, minus three that contradict
# deliberate choices, plus two of the repo's own rules. A workload that needs what a check forbids
# carries an ignore-check.kube-linter.io/<check> annotation saying why. tests/policy/test_k8s.py checks
# the conventions kube-linter cannot express.
checks:
  exclude:
    # LinuxServer images write to their root filesystem.
    - no-read-only-root-fs
    # LinuxServer images start as root and drop to PUID 1000.
    - run-as-non-root
    # It requires memory limits, which are set only where a runaway can starve the node (CLAUDE.md).
    # unset-memory-request below requires the requests instead. The default unset-cpu-requirements
    # already requires CPU requests, and only those.
    - unset-memory-requirements
  # The hand-written monitoring tree is replaced by kube-prometheus-stack once the cluster exists, and is
  # left untouched until then (TODO.md).
  ignorePaths:
    - k8s/prometheus/**
    - k8s/grafana/**
    - k8s/node-exporter/**
    - k8s/kube-state-metrics/**
customChecks:
  - name: no-pull-always
    description: imagePullPolicy Always defeats tag pinning (CLAUDE.md)
    remediation: Pin the image to an immutable tag and leave imagePullPolicy unset.
    template: image-pull-policy
    params:
      forbiddenPolicies: [Always]
  # A container without a memory request is scheduled as if it needed none (CLAUDE.md: requests on every
  # workload). This flags a request between 0 and 0 MB, which is what an unset one reads as.
  - name: unset-memory-request
    description: Every container requests memory (CLAUDE.md)
    remediation: Set resources.requests.memory.
    template: memory-requirements
    params:
      requirementsType: request
      upperBoundMB: 0
