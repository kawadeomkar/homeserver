---
# Spins the apps down: every app scaled to zero, with Flux told to leave it there, until make up. Check
# first, and narrow it with ONLY (comma-separated: an app such as jellyfin, a group such as media):
#   make check-down
#   make down ONLY=jellyfin,nextcloud
# The data stays, and so does the platform (Flux, Traefik, monitoring). Without a cluster nothing happens.
- name: Spin the apps down
  hosts: kubernetes
  gather_facts: false
  pre_tasks:
    - name: Refuse NAS settings that come without a NAS address
      ansible.builtin.assert:
        that: nas_section_error | length == 0
        fail_msg: "{{ nas_section_error }}"
        quiet: true
      tags: [always]
    - name: Refuse an incomplete Kubernetes section
      ansible.builtin.assert:
        that: kubernetes_settings_error | length == 0
        fail_msg: "{{ kubernetes_settings_error | join(' ') }}"
        quiet: true
      tags: [always]
    - name: Say why the cluster is skipped
      ansible.builtin.debug:
        msg: No kubernetes_node_addresses in group_vars/all/local.yml, so this setup has no cluster.
      when: not kubernetes_present
      tags: [always]
    - name: Skip the cluster when local.yml names no nodes
      ansible.builtin.meta: end_host
      when: not kubernetes_present
      tags: [always]
  roles:
    - role: app_scale
      vars:
        app_scale_state: down
        # make's ONLY, comma-separated names, passed as -e '{"only": "<names>"}'.
        app_scale_only: "{{ (only | default('')).split(',') | map('trim') | select | list }}"
